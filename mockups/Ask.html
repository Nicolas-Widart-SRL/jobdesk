<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask or run</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&amp;family=Zilla+Slab:wght@600&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootCls}}" data-theme="{{theme}}">
  <div class="scrim">
    <button class="scrim-hit" type="button" aria-label="Close" onClick="{{close}}"></button>
    <div class="ask" role="dialog" aria-label="Ask or run">
      <div class="field">
        <label for="askq">What do you want to do?</label>
        <input id="askq" value="{{q}}" onChange="{{setQ}}" onKeyDown="{{onKey}}" placeholder="Paste a posting URL, or type a company or task"
          role="combobox" aria-autocomplete="list" aria-controls="askhits" aria-expanded="{{expanded}}" aria-activedescendant="{{activeId}}">
      </div>
      <sc-if value="{{hasHits}}" hint-placeholder-val="{{ true }}">
        <div class="list" id="askhits" role="listbox" aria-label="Matching commands">
          <sc-for list="{{hits}}" as="h" hint-placeholder-count="6">
            <button class="li {{h.cls}}" type="button" role="option" id="{{h.id}}" aria-selected="{{h.selected}}" tabIndex="-1" onClick="{{h.pick}}"><span class="grow trunc">{{h.t}}</span><span class="muted" style="white-space: nowrap">{{h.est}}</span></button>
          </sc-for>
        </div>
        <div>
          <div class="muted" style="font-size: 12px; margin-bottom: 4px">Sent to Claude</div>
          <div class="code mono">{{hit.cmd}}</div>
        </div>
        <div class="row wrap"><span class="muted grow">Runs in the background. You stay where you are.</span><a class="btn" href="Commands.html">All commands</a><button class="btn pri" type="button" onClick="{{hit.pick}}">Run</button></div>
      </sc-if>
      <sc-if value="{{noHits}}" hint-placeholder-val="{{ false }}">
        <div class="row wrap"><span class="muted grow">No command matches that.</span><a class="btn" href="Commands.html">All commands</a></div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null},"preset":{"editor":null},"onClose":{"editor":null},"onRun":{"editor":null},"$preview":{"width":720,"height":600}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: (p && p.preset) || '', sel: 0 }; }
  componentDidMount() {
    if (!this.props.embedded) return;
    const el = document.getElementById('askq');
    if (el) el.focus();
  }
  actions() {
    const A = (t, cmd, est, more) => ({ t, cmd, est, words: (t + ' ' + cmd + ' ' + (more || '')).toLowerCase() });
    return [
      A('Prepare for Tessel Group, final round', '/interview tessel final', 'Usually $0.48, 3 min'),
      A('Find new postings', '/scrape', 'Usually $0.41, 4 min', 'search jobs'),
      A('Score new postings', '/rank --limit 15', 'Usually $0.62, 5 min', 'shortlist'),
      A('Record a result', '/outcome', 'Usually $0.09, 1 min'),
      A('Record a result for Tessel Group', '/outcome tessel', 'Usually $0.09, 1 min'),
      A('Record a result for Ardent Software', '/outcome ardent', 'Usually $0.09, 1 min', 'offer'),
      A('Draft follow-ups for quiet applications', '/outcome followup', 'Usually $0.35, 3 min', 'chase nudge'),
      A('Draft a follow-up to Granite Cloud', '/outcome followup granite', 'Usually $0.09, 1 min', 'chase nudge'),
      A('Review applications quiet for 60 days', '/outcome stale', 'Usually $0.15, 2 min', 'close sweep'),
      A('Check mail for replies', '/gmail-sync', 'Usually $0.12, 1 min', 'email inbox'),
      A('Push jobs to Notion', '/notion-sync --min-score 60', 'Usually $0.20, 2 min'),
      A('Find skill gaps', '/upskill', 'Usually $0.85, 6 min', 'learn'),
      A('Rebuild the HTML dashboard', '/html-report', 'Usually $0.12, 1 min', 'report'),
      A('Update your profile', '/setup', 'Usually $0.70, 6 min'),
      A('Calibrate fit scoring', '/setup', 'Usually $0.70, 6 min', 'outcomes skip reasons'),
      A('Find new signals in your documents', '/expand', 'Usually $0.55, 5 min'),
      A('Check portal health', '/scrape health', 'Usually $0.10, 1 min'),
      A('Add a job portal', '/add-portal', 'Usually $1.00, 8 min'),
      A('Add a CV or letter template', '/add-template', 'Usually $0.40, 4 min'),
    ];
  }
  hits() {
    const q = this.state.q.trim();
    if (/^https?:\/\//i.test(q)) return [{ t: 'Evaluate this posting', cmd: '/apply ' + q, est: 'Usually $1.30, 8 min' }];
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    return this.actions().filter((a) => words.every((w) => a.words.includes(w))).slice(0, 6);
  }
  run(h) { if (this.props.onRun) this.props.onRun(h); }
  close() { if (this.props.onClose) this.props.onClose(); }
  onKey(e) {
    const hits = this.hits(), sel = Math.min(this.state.sel, Math.max(hits.length - 1, 0));
    if (e.key === 'Escape') this.close();
    else if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ sel: Math.min(sel + 1, hits.length - 1) }); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ sel: Math.max(sel - 1, 0) }); }
    else if (e.key === 'Enter' && hits[sel]) { e.preventDefault(); this.run(hits[sel]); }
  }
  renderVals() {
    const list = this.hits(), sel = Math.min(this.state.sel, Math.max(list.length - 1, 0));
    const hits = list.map((h, i) => ({ ...h, id: 'askhit-' + i, selected: i === sel ? 'true' : 'false', cls: i === sel ? 'sel' : '', pick: () => this.run(h) }));
    let saved = null;
    try { saved = localStorage.getItem('jobdesk-theme'); } catch (e) {}
    return {
      rootCls: this.props.embedded ? '' : 'app', theme: saved || 'system', q: this.state.q, hits, hit: hits[sel] || {},
      hasHits: hits.length > 0, noHits: hits.length === 0,
      expanded: hits.length > 0 ? 'true' : 'false', activeId: hits[sel] ? hits[sel].id : '',
      setQ: (e) => this.setState({ q: e.target.value, sel: 0 }), onKey: (e) => this.onKey(e), close: () => this.close(),
    };
  }
}
</script>
</body>
</html>
