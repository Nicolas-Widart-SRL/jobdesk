# Publishes site/, the landing page, to GitHub Pages at https://nicolas-widart-srl.github.io/jobdesk/.
# The folder is served as is, with no build step. It runs on a push to main that changes site/ or this file,
# and from the Actions tab. The repository's Pages source must be "GitHub Actions".
# The build job only reads the repository. The deploy job alone may write Pages and request the OIDC token
# that deploy-pages needs, and only in the github-pages environment. Actions are pinned to commits.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits for the deploy in progress, and never cancels it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails early when Pages is off or its source is not GitHub Actions.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
