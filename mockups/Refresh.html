<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Refresh: a clearer, less bland Jobdesk</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&amp;family=Zilla+Slab:wght@600&amp;family=Courier+Prime:wght@400;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/* Refresh canvas. Choose with ?dir=A|B|C|all, ?screen=today|nodates|clear|firstrun|failed|loading|jobs|tracker|directions
   and ?theme=light|dark. All data is fictional and matches tests/sample_workspace. Today is Saturday 31 October.
   Every rule is scoped to .rf so the other canvases are unchanged. Direction tokens that do not exist in
   palette.rs are marked NEW and listed in README.md. */
body { margin: 0; }
.rf { height: 100vh; min-height: 0; overflow: hidden; }
.rf .main { min-height: 0; }
.rf .num { font-variant-numeric: tabular-nums; }

/* ---------- Shared parts of the refresh (all directions) ---------- */
.rf .tabcount { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 2px; font: 600 12.5px/1 "Schibsted Grotesk", system-ui, sans-serif; }
.rf .split2 { flex: 1 1 auto; min-height: 0; display: flex; gap: 28px; align-items: stretch; }
.rf .col-a { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.rf .col-b { flex: 0 0 292px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.rf .tabrow2 { display: flex; align-items: flex-end; gap: 12px; }
.rf .ktab2 { display: inline-flex; align-items: center; gap: 10px; height: 30px; padding: 0 14px; border-radius: 6px 6px 0 0; font-weight: 600; }
.rf .ktab2 .when { font-weight: 500; color: var(--muted); }
.rf .pos { margin-left: auto; padding-bottom: 6px; font-size: 13px; color: var(--muted); }
.rf .card2 { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 0 4px 4px 4px; }
.rf .card2 .cbody2 { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 18px 22px 14px; }
.rf .card2 .cfoot { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 22px 14px; border-top: 1px solid var(--line); }
.rf .cfoot .why { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; line-height: 1.35; }
.rf .cfoot .why button { padding: 0; border: 0; background: none; color: var(--active); font-size: 13px; text-decoration: underline; cursor: pointer; }
.rf .who { display: flex; align-items: flex-start; gap: 14px; }
.rf .who .co { font-size: 14px; color: var(--muted); }
.rf .who h2 { margin: 1px 0 3px; font: 600 28px/1.15 var(--slab); }
.rf .who .stamp { margin-top: 4px; }
.rf .verdict { font-size: 15px; }
.rf .checks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 20px; }
.rf .chk2 { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.rf .chk2 .k { font-size: 12.5px; color: var(--muted); }
.rf .chk2 .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rf .chk2 .tag { margin-left: auto; flex: none; }
.rf .sg { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.rf .sg h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.rf .sg ul { margin: 0; padding: 0; list-style: none; }
.rf .sg li { position: relative; padding-left: 16px; margin-bottom: 3px; }
.rf .sg li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 6px; height: 2px; background: currentColor; }
.rf .sg .plus li::before { box-shadow: 2px -2px 0 -0px transparent; }
.rf .edges { flex: none; }
.rf .edges i { display: block; height: 5px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 3px 3px; background: var(--raised); }
.rf .slip2 { border-radius: 4px; background: var(--panel); }
.rf .slip2 .sh { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); font: 600 17px/1.3 var(--slab); }
.rf .slip2 .sh .n { margin-left: auto; font: 400 13px/1.3 "Schibsted Grotesk", system-ui, sans-serif; color: var(--muted); }
.rf .slip2 .sb { padding: 8px 14px 10px; }
.rf .lrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); min-width: 0; }
.rf .lrow:first-child { border-top: 0; }
.rf .lrow .nm { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rf .lrow .what { flex: none; color: var(--muted); font-size: 13px; }
.rf .urow { display: flex; flex-direction: column; gap: 4px; margin: 0 -14px; padding: 9px 14px 10px; background: var(--raised); }
.rf .urow .top { display: flex; align-items: center; gap: 8px; }
.rf .btn .kb { margin-left: 2px; }
.rf .btn.sm .kb { min-width: 16px; height: 16px; font-size: 11px; }
.rf .agenda .ag { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; align-items: baseline; gap: 4px 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.rf .agenda .ag:first-child { border-top: 0; }
.rf .agenda .d2 { font-size: 13px; color: var(--muted); }
.rf .agenda .ev2 { min-width: 0; line-height: 1.3; }
.rf .agenda .ev2 small { display: block; font-size: 12.5px; color: var(--muted); }
.rf .agenda .ag.done .ev2 { color: var(--faint); }
.rf .agenda .ag.done .ev2 small { color: var(--faint); }
.rf .agenda .what2 { font-size: 12.5px; color: var(--faint); }
.rf .agenda .ag { min-height: 34px; }
.rf .agenda .foot { padding-top: 6px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.rf .statusbar { flex: none; display: flex; align-items: center; gap: 18px; padding: 6px 28px; font-size: 13px; }
.rf .statusbar .seg { margin-left: auto; border: 0; }
.rf .statusbar .seg button { height: 24px; padding: 0 8px; border-radius: 3px; font-size: 12.5px; }
.rf .sq { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }

/* ---------- Direction A: Ledger, tidied. Existing tokens only. ---------- */
.dir-a .card2 { background: var(--page); box-shadow: inset 0 0 0 1px var(--line); }
.dir-a .ktab2 { background: var(--page); box-shadow: inset 1px 1px 0 var(--line), inset -1px 0 0 var(--line); }
.dir-a .tabcount { background: var(--text); color: var(--sheet); }
.dir-a .hz2 { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); border-radius: 4px; background: var(--panel); }
.dir-a .hz2 > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 54px; padding: 6px 7px 7px; border-left: 1px solid var(--line); font-size: 12.5px; }
.dir-a .hz2 > div:first-child { border-left: 0; background: var(--raised); border-radius: 4px 0 0 4px; }
.dir-a .hz2 .dd { color: var(--muted); }
.dir-a .hz2 .today .dd { color: var(--text); font-weight: 600; }
.dir-a .hz2 b { font-weight: 600; line-height: 1.2; }
.dir-a .hz2 s { color: var(--faint); line-height: 1.2; }

/* ---------- Direction B: Postmark (recommended) ---------- */
/* NEW tokens. The chrome borrows the dark theme's values, so the frame is one identity in both themes.
   The stamp is the "Stamp magenta" candidate from the Runs round: one ink that means "this needs you". */
.dir-b { --chrome: #12263f; --chrome-ink: #e6edf5; --chrome-muted: #b3c4d6; --chrome-tab: #233b59; --chrome-line: #33506f;
  --stamp: #f48cc0; --on-stamp: #0d1a2b; --stamp-chrome: #f48cc0; --on-stamp-chrome: #0d1a2b; --card: var(--panel); }
.dir-b[data-theme="light"] { --stamp: #b0246a; --on-stamp: #ffffff; --card: var(--page); }
.dir-b[data-theme="dark"] { --chrome: #0d1a2b; --chrome-tab: #1a2f49; --card: var(--panel); }
.dir-b .band { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 12px 28px 0; background: var(--chrome); color: var(--chrome-ink); }
.dir-b .band .brand { color: var(--chrome-ink); }
.dir-b .band .brand svg path:last-child { stroke: var(--chrome); }
.dir-b .band .newtask { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--chrome-line); border-radius: 3px; background: var(--chrome-tab); color: var(--chrome-ink); font-weight: 500; }
.dir-b .band .newtask .keys { color: var(--chrome-muted); }
.dir-b .tabs { flex: 0 0 100%; display: flex; gap: 3px; padding-top: 4px; }
.dir-b .tabs a { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 18px; border-radius: 6px 6px 0 0; color: var(--chrome-muted); font-weight: 500; }
.dir-b .tabs a.on { background: var(--sheet); color: var(--text); font-weight: 600; }
.dir-b .tabs a.off { opacity: .55; }
.dir-b .tabcount { background: var(--stamp-chrome); color: var(--on-stamp-chrome); }
.dir-b .tabs a.on .tabcount { background: var(--stamp); color: var(--on-stamp); }
.dir-b .tabs .warn { display: inline-block; width: 8px; height: 8px; background: var(--closed); }
.dir-b .tabs a:not(.on) .warn { background: #f7a697; }
.dir-b .bhead { flex: none; display: flex; align-items: center; gap: 16px; padding: 18px 32px 14px; }
.dir-b .bhead h1 { margin: 0; font: 600 44px/1.05 var(--slab); }
.dir-b .bhead .sub { margin-top: 4px; font-size: 15px; color: var(--muted); }
.dir-b .bhead .actions2 { margin-left: auto; display: flex; gap: 8px; align-self: flex-end; }
.dir-b .ring { flex: none; width: 84px; height: 84px; }
.dir-b .bbody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 0 32px 16px; }
.dir-b .card2 { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.dir-b .ktab2 { background: var(--card); box-shadow: inset 1px 1px 0 var(--line), inset -1px 0 0 var(--line); }
.dir-b .ktab2.mine { background: var(--stamp); color: var(--on-stamp); box-shadow: none; }
.dir-b .ontop { display: inline-block; padding: 0 6px; border-radius: 2px; background: var(--stamp); color: var(--on-stamp); font-size: 12.5px; font-weight: 600; line-height: 18px; }
.dir-b .statusbar { background: var(--chrome); color: var(--chrome-muted); }
.dir-b .statusbar .seg button { background: none; color: var(--chrome-muted); }
.dir-b .statusbar .seg button.on { background: var(--chrome-tab); color: var(--chrome-ink); }
.dir-b .alert2 { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-radius: 2px; border: 1px solid var(--closed); background: var(--sheet); box-shadow: 5px 5px 0 var(--closed); margin-right: 5px; }
.dir-b .alert2 b { color: var(--closed); }
.dir-b .skel { background: var(--panel); border-radius: 2px; }
.dir-b .slip2 .skel { background: var(--raised); }
.dir-b .need { color: var(--stamp); font-weight: 600; }
.dir-b .needsq { display: inline-block; width: 8px; height: 8px; background: var(--stamp); }

/* Jobs (B) */
.dir-b .seg2 { display: flex; gap: 3px; border-bottom: 1px solid var(--text); }
.dir-b .seg2 button { height: 34px; padding: 0 12px; border: 0; border-radius: 4px 4px 0 0; background: none; color: var(--muted); font-weight: 500; }
.dir-b .seg2 button.on { background: var(--text); color: var(--sheet); font-weight: 600; }
.dir-b .seg2 button .faint { color: inherit; opacity: .8; margin-left: 4px; }
.dir-b .jt { width: 100%; border-collapse: collapse; }
.dir-b .jt th { text-align: left; padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--text); white-space: nowrap; }
.dir-b .jt td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.dir-b .jt tr.sel td { background: var(--panel); }
.dir-b .jt .sc { font: 600 21px/1 var(--slab); }
.dir-b .jt .role { font-weight: 600; }
.dir-b .jt .co { color: var(--muted); font-size: 13px; }
.dir-b .detail { flex: 0 0 340px; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); min-height: 0; overflow: hidden; }
.dir-b .detail h2 { margin: 0; font: 600 19px/1.2 var(--slab); }
.dir-b .crow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.dir-b .crow .k { flex: 0 0 92px; color: var(--muted); font-size: 13px; }
.dir-b .crow .v { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Tracker (B) */
.dir-b .board2 { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.dir-b .lane2 { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 12px; border-radius: 4px; background: var(--panel); min-height: 0; }
.dir-b .lane2 .lh { display: flex; align-items: center; gap: 8px; padding: 0 3px 4px; font: 600 17px/1.3 var(--slab); }
.dir-b .lane2 .lh .sq { margin: 0; }
.dir-b .lane2 .lh .n { font: 400 13px/1 "Schibsted Grotesk", system-ui, sans-serif; color: var(--muted); }
.dir-b .ic { display: flex; flex-direction: column; gap: 1px; padding: 9px 11px; border-radius: 2px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.dir-b .ic.mine { box-shadow: inset 3px 0 0 var(--stamp), inset 0 0 0 1px var(--line); }
.dir-b .ic b { font-weight: 600; }
.dir-b .ic .r { color: var(--muted); }
.dir-b .ic .st { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.dir-b .ic .st .fit { margin-left: auto; color: var(--faint); white-space: nowrap; }
.dir-b .ic.closed { opacity: .8; }
.dir-b .note2 { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 4px; background: var(--panel); }

/* First run (B) */
.dir-b .welcome { flex: 1 1 auto; display: flex; justify-content: center; align-items: flex-start; padding: 36px 32px 0; }
.dir-b .wcard { width: 620px; display: flex; flex-direction: column; gap: 16px; padding: 26px 28px; border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 6px 6px 0 var(--line); }
.dir-b .wcard h1 { margin: 0; font: 600 34px/1.1 var(--slab); }
.dir-b .wstep { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.dir-b .wstep .kn { grid-row: span 2; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 2px; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 13px; }
.dir-b .wstep.now .kn { background: var(--text); color: var(--sheet); }
.dir-b .wstep b { font-weight: 600; }
.dir-b .wstep .m { grid-column: 2; color: var(--muted); font-size: 13.5px; }
.dir-b .wstep .btn { grid-row: 1 / span 2; grid-column: 3; }

/* ---------- Direction C: Graph pad ---------- */
/* NEW palette and face. Engineering-pad green paper, graphite ink, a highlighter for what needs you. */
.dir-c, .dir-c[data-theme="light"] { --pad: #e4ece0; --grid: #cbdac4; --sheet: #f9fbf7; --panel: #edf2ea; --raised: #dfe8da; --line: #bccbb5; --text: #1d2a25; --muted: #44534c; --faint: #56655e;
  --hl: #f2e35c; --on-hl: #1d2a25; --off: #c4d3bd; --field: #ffffff; --pri: #1d2a25; --on-pri: #f9fbf7; --page: #ffffff;
  font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif; --slab: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  background-color: var(--pad);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px; }
.dir-c .main { background: none; }
.dir-c .pad-top { flex: none; display: flex; align-items: flex-end; gap: 28px; padding: 18px 40px 0; }
.dir-c .pad-top .brand { margin-right: 0; font: 700 22px/1 var(--slab); }
.dir-c .pad-top .brand svg path:last-child { stroke: var(--pad); }
.dir-c .tabs3 { display: flex; gap: 22px; }
.dir-c .tabs3 a { position: relative; padding: 0 2px 6px; color: var(--muted); font-weight: 500; }
.dir-c .tabs3 a.on { color: var(--text); font-weight: 700; }
.dir-c .tabs3 a.on::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: 5px; height: 10px; background: var(--hl); z-index: -1; }
.dir-c .tabs3 a { z-index: 0; }
.dir-c .tabcount { background: var(--hl); color: var(--on-hl); }
.dir-c .newtask3 { margin-left: auto; align-self: center; }
.dir-c .chead { flex: none; display: flex; align-items: baseline; gap: 18px; padding: 22px 40px 14px; }
.dir-c .chead h1 { margin: 0; font: 700 40px/1 var(--slab); letter-spacing: -0.5px; }
.dir-c .chead .sub { font-size: 15px; color: var(--muted); }
.dir-c .cbody3 { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 0 40px 16px; }
.dir-c .strip3 { flex: none; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); background: var(--sheet); box-shadow: inset 0 0 0 1px var(--text); }
.dir-c .strip3 > div { min-height: 60px; padding: 6px 7px; border-left: 1px solid var(--line); font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dir-c .strip3 > div:first-child { border-left: 0; }
.dir-c .strip3 .dd { color: var(--muted); }
.dir-c .strip3 .today { background: var(--hl); }
.dir-c .strip3 .today .dd { color: var(--text); font-weight: 700; }
.dir-c .strip3 b { font-weight: 700; line-height: 1.2; }
.dir-c .strip3 s { color: var(--faint); line-height: 1.2; }
.dir-c .card2 { background: var(--sheet); box-shadow: inset 0 0 0 1px var(--text), 4px 4px 0 var(--grid); border-radius: 0 2px 2px 2px; }
.dir-c .ktab2 { border-radius: 0; background: var(--text); color: var(--sheet); }
.dir-c .ktab2 .when { color: var(--sheet); opacity: .8; }
.dir-c .ktab2 .c-active { color: var(--hl); }
.dir-c .tabs3 { align-self: center; padding-top: 6px; }
.dir-c .who h2 { font: 700 26px/1.15 var(--slab); }
.dir-c .stamp { font: 700 30px/1 var(--slab); }
.dir-c .slip2 { background: var(--sheet); box-shadow: inset 0 0 0 1px var(--line); border-radius: 2px; }
.dir-c .slip2 .sh { font: 700 16px/1.3 var(--slab); }
.dir-c .statusbar { background: var(--sheet); color: var(--muted); box-shadow: inset 0 1px 0 var(--line); }
.dir-c .statusbar .seg button.on { background: var(--hl); color: var(--on-hl); }
.dir-c .mark-hl { background: var(--hl); padding: 0 3px; }

/* ---------- Direction board ---------- */
.board3 { height: 100vh; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 18px; box-sizing: border-box; background: #bdccdc; font: 400 13px/1.4 "Schibsted Grotesk", system-ui, sans-serif; color: #12263f; }
.board3 .dcol { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; border-radius: 4px; background: #eff3f8; min-width: 0; }
.board3 h2 { margin: 0; font: 600 24px/1.1 "Zilla Slab", serif; }
.board3 .tagl { font-size: 12.5px; color: #35495f; }
.board3 .sw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.board3 .sw div { display: flex; flex-direction: column; justify-content: flex-end; height: 58px; padding: 5px 6px; border-radius: 2px; font-size: 11.5px; line-height: 1.2; box-shadow: inset 0 0 0 1px rgba(18,38,63,.18); }
.board3 .spec2 { padding: 10px 0 2px; border-top: 1px solid #aebfd1; }
.board3 .spec2 .k { font-size: 12px; color: #35495f; margin-bottom: 3px; }
.board3 .rec { align-self: flex-start; padding: 0 7px; height: 22px; display: inline-flex; align-items: center; border-radius: 2px; background: #b0246a; color: #fff; font-weight: 600; font-size: 12.5px; }
.board3 ul { margin: 0; padding-left: 16px; }
.board3 li { margin-bottom: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- Data (fictional, from tests/sample_workspace) ----------
const P = new URLSearchParams(location.search);
const DIR = (P.get('dir') || 'B').toUpperCase();
const SCREEN = (P.get('screen') || 'today').toLowerCase();
const THEME = (P.get('theme') || 'light').toLowerCase();

const MARK = '<svg xmlns="http://www.w3.org/2000/svg" width="26" aria-hidden="true" viewBox="186 216 652 600"><path d="M206 272a36 36 0 0 1 36-36h228a36 36 0 0 1 36 36v28h276a36 36 0 0 1 36 36v424a36 36 0 0 1-36 36H242a36 36 0 0 1-36-36Z" fill="currentColor"></path><path d="M596 408V596a96 96 0 0 1-96 96H392" fill="none" stroke="var(--bg)" stroke-width="86"></path></svg>';
const KEYS = '<span class="keys"><span>⌘</span><span>K</span></span>';
const kb = (k) => `<span class="kb">${k}</span>`;

// The day ring: one tick per card dealt today, filled once decided. Painted with line segments and text.
function ring(total, done, opts = {}) {
  const ticks = [];
  for (let i = 0; i < total; i++) {
    const a = -Math.PI / 2 + (i + 0.5) * (2 * Math.PI / total);
    const r1 = 29.5, r2 = 36;
    const x1 = 40 + r1 * Math.cos(a), y1 = 40 + r1 * Math.sin(a), x2 = 40 + r2 * Math.cos(a), y2 = 40 + r2 * Math.sin(a);
    const col = opts.empty ? 'var(--off)' : (i < done ? 'var(--text)' : 'var(--off)');
    ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="4.5"/>`);
  }
  const edge = opts.empty ? 'var(--line)' : 'var(--text)';
  const inner = `<circle cx="40" cy="40" r="38.5" fill="none" stroke="${edge}" stroke-width="1"/><circle cx="40" cy="40" r="27" fill="none" stroke="${edge}" stroke-width="1"/>`;
  return `<svg class="ring" viewBox="0 0 80 80" role="img" aria-label="${opts.label || ''}">${ticks.join('')}${inner}
    <text x="40" y="28" text-anchor="middle" font-size="11.9" font-family="Schibsted Grotesk, sans-serif" fill="var(--muted)">Sat</text>
    <text x="40" y="48.5" text-anchor="middle" font-size="24.8" font-weight="600" font-family="Zilla Slab, serif" fill="var(--text)">31</text>
    <text x="40" y="61" text-anchor="middle" font-size="11.9" font-family="Schibsted Grotesk, sans-serif" fill="var(--muted)">Oct</text></svg>`;
}

    <section class="dcol" style="box-shadow: inset 0 0 0 2px #b0246a"><h2>B. Postmark</h2><span class="rec">Recommended</span><span class="tagl">Ledger's faces and status inks, in a navy frame, with one ink that means "this needs you".</span>
      <div class="sw">${sw('#12263f', '#e6edf5', 'Frame (NEW)', '#12263f')}${sw('#233b59', '#e6edf5', 'Frame tab (NEW)', '#233b59')}${sw('#eff3f8', '#12263f', 'Sheet', '#eff3f8')}${sw('#ffffff', '#12263f', 'Card: page', '#ffffff')}${sw('#b0246a', '#ffffff', 'Stamp (NEW)', '#b0246a')}${sw('#f48cc0', '#0d1a2b', 'Stamp on navy (NEW)', '#f48cc0')}</div>
