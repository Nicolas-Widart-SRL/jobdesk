[package]
name = "jobdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "jobdesk"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "persistence", "wgpu", "wayland", "x11"] }
egui = "0.37"
egui_commonmark = { version = "0.26", default-features = false }
egui_extras = "0.37"
notify = "8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
tempfile = "3"
