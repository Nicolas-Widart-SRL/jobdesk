# Builds the macOS DMG and the Windows setup as the artifacts `dmg` and `setup`. It never publishes.
# tag-release.yml calls it on the merge commit of a release PR, then tags and publishes.
# Run it from the Actions tab to build the installers of a branch without a release.
# A manual run with `quick` skips clippy and tests, and labels the files `-untested`.
# tag-release.yml has no `quick` input, so a release always tests.
# The Windows installer is not signed. See the Install section of README.md and the Package section of CONTRIBUTING.md.
# The macOS app is signed with a Developer ID Application certificate and notarized by Apple, only when tag-release.yml
# calls with `sign: true`. Then the job package-macos-signed runs, and it alone sets `environment: release`. The six
# Apple secrets are environment secrets of `release`, which allows deployments from main only. tag-release.yml passes
# each by name, and the environment's value reaches only that job. A branch, a fork and a manual run from the Actions
# tab get no secret: a manual run has no `sign` input, so it runs package-macos, ad-hoc signed and not notarized. A
# release with a secret missing fails, and never ships ad-hoc signed.
# The secrets reach only the step that runs cargo-packager, and only in the main-only `release` environment. The job
# runs the reviewed merge commit with `--locked`, a pinned cargo-packager and its actions pinned to commits. It does
# not isolate the secrets from the dependencies of the app: a build script of a dependency runs on the same machine.
# `dmg` also holds the app as a .tar.gz, the file a copy of Jobdesk downloads to update itself. It is packed from the
# signed, notarized app, and the workflow checks the unpacked copy and the app on the DMG again. On Windows that file
# is the setup. This workflow never sees the update key, and nothing it builds is signed for updates: only the sign
# job of tag-release.yml signs, and only for a release.
name: Installers

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        type: string
        required: true
      tag:
        description: The release tag, vX.Y.Z. It must match the Cargo.toml version and names the files.
        type: string
        required: false
        default: ''
      sign:
        description: Sign the macOS app with a Developer ID certificate and notarize it. A missing secret then fails the build.
        type: boolean
        required: false
        default: false
    secrets:
      APPLE_CERTIFICATE:
        description: The Developer ID Application certificate and its private key, as a .p12 file in base64.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: The password of that .p12 file.
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'The certificate name, such as "Developer ID Application: Name (TEAMID)".'
        required: false
      APPLE_API_ISSUER:
        description: The issuer ID of the App Store Connect API key.
        required: false
      APPLE_API_KEY:
        description: The key ID of the App Store Connect API key.
        required: false
      APPLE_API_KEY_P8:
        description: The contents of the AuthKey .p8 file of that key.
        required: false
  workflow_dispatch:
    inputs:
      quick:
        description: Skip clippy and tests, for a fast untested build.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: '0.11.8'

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tests: ''
          # Screen snapshots are macOS baselines, so Windows builds and runs the tests with the snapshot compares skipped.
          - os: windows-latest
            tests: ''
    # Under workflow_call inputs.quick is null, so a release always runs this job.
    if: ${{ !inputs.quick }}
    runs-on: ${{ matrix.os }}
    steps:
      # A manual run has no `ref`, so it builds the commit the run started on.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked ${{ matrix.tests }}
      # A failing snapshot writes the new picture and its diff: keep them for review.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshots-${{ matrix.os }}
          path: |
            tests/snapshots/*.diff.png
            tests/snapshots/*.new.png
          if-no-files-found: ignore

  version:
    name: Read the app version
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.read.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Read the version and name the installers
        id: read
        env:
          TAG: ${{ inputs.tag }}
          QUICK: ${{ inputs.quick }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ -n "$TAG" ]; then
            if [ "v$version" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match Cargo.toml version $version"
              exit 1
            fi
            label="$TAG"
          else
            label="v$version-$(git rev-parse --short=7 HEAD)"
          fi
          if [ "$QUICK" = "true" ]; then
            label="$label-untested"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

  package-windows:
    name: Build setup
    needs: [version, test]
    # Runs when a quick build skips test, never when a need failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      - run: cargo packager --release --formats nsis
      - name: Name the installer
        env:
          BUILT: '*-setup.exe'
          NAME: Jobdesk-${{ needs.version.outputs.label }}-windows-x64-setup.exe
        run: scripts/pack-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/*
          if-no-files-found: error

  # An ad-hoc signed app: every run that does not ask for a signed release, such as a manual run.
  package-macos:
    name: Build dmg
    needs: [version, test]
    if: ${{ !cancelled() && !failure() && !inputs.sign }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      - run: cargo packager --release --formats app,dmg
      - name: Name the installer and pack the update
        env:
          BUILT: '*.dmg'
          NAME: Jobdesk-${{ needs.version.outputs.label }}-macos-arm64.dmg
          BUNDLE: Jobdesk.app
          UPDATE_NAME: Jobdesk-${{ needs.version.outputs.label }}-macos-arm64.app.tar.gz
        run: scripts/pack-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*
          if-no-files-found: error

  # A signed and notarized app, for a release. The environment gives this job the Apple secrets, and only when the run
  # belongs to main. In a called workflow, the job that sets `environment` is the one that gets the environment's
  # secrets, and the caller passes each secret by name.
  package-macos-signed:
    name: Build dmg (signed)
    needs: [version, test]
    if: ${{ !cancelled() && !failure() && inputs.sign }}
    runs-on: macos-latest
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      # Pinned to commits, because this job holds the Apple secrets.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      # The app is built before the step that holds the secrets, and that step replaces the before-packaging-command of
      # cargo-packager, which would build again, with `true`. The two steps share one machine, so this is not a wall
      # between the build scripts of the dependencies and the secrets. What holds is `--locked`, the pinned cargo-packager,
      # the pinned actions, and that the secrets exist only in a run on main, from the reviewed merge commit.
      - name: Build the app
        run: cargo build --release --locked

      # cargo-packager 0.11.8 does what this step relies on:
      # - It signs only with the signing-identity of Cargo.toml and ignores APPLE_SIGNING_IDENTITY, so the step puts the
      #   identity in Cargo.toml of this checkout. The checkout is thrown away after the run.
      # - APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD make it import the certificate into a temporary keychain of
      #   its own, use it to sign, and delete it. It signs every binary inside out, and the app and the DMG last. Every
      #   binary and the app get the hardened runtime and a secure timestamp.
      # - With the three notarization variables it notarizes the app and staples the ticket to the app, before it builds
      #   the DMG, so the DMG holds the stapled app. The DMG is signed but not notarized.
      # The API key is a file for notarytool, so it is written to a temporary folder and deleted when the step ends.
      - name: Package, sign and notarize
        # notarytool waits for Apple with no limit of its own.
        timeout-minutes: 60
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=''
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "$(printf '%s' "${!name}" | tr -d '[:space:]')" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::A release must be signed and notarized, and these secrets are empty or not set:$missing. Add them as environment secrets of the release environment, as the macOS signing section of CONTRIBUTING.md says."
            exit 1
          fi
          case "$APPLE_SIGNING_IDENTITY" in
            [[:space:]]* | *[[:space:]] | *[[:cntrl:]\"\\]*)
              echo '::error::APPLE_SIGNING_IDENTITY must have no space at either end, no control character such as a newline, no quote and no backslash.'
              exit 1
              ;;
          esac
          case "$APPLE_API_KEY" in
            *[!A-Za-z0-9]*)
              echo '::error::APPLE_API_KEY must be the key ID, letters and digits only.'
              exit 1
              ;;
          esac
          if ! awk '
            $0 == "signing-identity = \"-\"" { print "signing-identity = \"" ENVIRON["APPLE_SIGNING_IDENTITY"] "\""; n++; next }
            $0 == "before-packaging-command = \"cargo build --release --locked\"" { print "before-packaging-command = \"true\""; m++; next }
            { print }
            END { exit (n != 1 || m != 1) }
          ' Cargo.toml > "$RUNNER_TEMP/Cargo.toml.signed"; then
            echo '::error::Cargo.toml must hold exactly one signing-identity = "-" line and one before-packaging-command = "cargo build --release --locked" line for the release to replace.'
            exit 1
          fi
          mv "$RUNNER_TEMP/Cargo.toml.signed" Cargo.toml
          keys=$(mktemp -d "$RUNNER_TEMP/apple-key.XXXXXX")
          # A step that times out gets SIGTERM, which skips an EXIT trap in some shells, so trap it too.
          cleanup() { rm -rf "$keys"; }
          trap cleanup EXIT
          trap 'cleanup; exit 143' TERM
          trap 'cleanup; exit 130' INT
          key="$keys/AuthKey_$APPLE_API_KEY.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")
          export APPLE_API_KEY_PATH="$key"
          unset APPLE_API_KEY_P8
          cargo packager --release --formats app,dmg

      - name: Name the installer and pack the update
        env:
          BUILT: '*.dmg'
          NAME: Jobdesk-${{ needs.version.outputs.label }}-macos-arm64.dmg
          BUNDLE: Jobdesk.app
          UPDATE_NAME: Jobdesk-${{ needs.version.outputs.label }}-macos-arm64.app.tar.gz
        run: scripts/pack-installer.sh

      # What a user gets must pass: the app on the DMG opened as a user opens it, the app as built, and the app unpacked
      # from the update file, which is what an installed copy installs. A failure stops the job, so nothing is uploaded.
      - name: Check the signed and notarized release
        env:
          NAME: Jobdesk-${{ needs.version.outputs.label }}-macos-arm64.dmg
          UPDATE_NAME: Jobdesk-${{ needs.version.outputs.label }}-macos-arm64.app.tar.gz
        run: |
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir "$mnt"
          trap 'hdiutil detach "$mnt" -force -quiet || true' EXIT
          codesign --verify --strict --verbose=2 "dist/$NAME"
          details=$(codesign -dv --verbose=4 "dist/$NAME" 2>&1)
          grep -q '^Authority=Developer ID Application: ' <<<"$details"
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "dist/$NAME"
          scripts/verify-macos-app.sh "$mnt/Jobdesk.app"
          scripts/verify-macos-app.sh target/packages/Jobdesk.app
          unpacked=$(mktemp -d "$RUNNER_TEMP/unpacked.XXXXXX")
          tar -xzf "dist/$UPDATE_NAME" -C "$unpacked"
          scripts/verify-macos-app.sh "$unpacked/Jobdesk.app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg
          path: dist/*
          if-no-files-found: error
