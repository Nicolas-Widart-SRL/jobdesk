<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First-run onboarding</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&amp;family=Zilla+Slab:wght@600&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
/* First-run onboarding, round 2: the compact card wizard (B). Choose with
   ?state=welcome|resume|place|notempty|download|offline|mismatch|checking|installing|toolfail      (small window, 720x560)
          |docs|dropped|reading|sheet-b1|sheet-b2|review|working|followup|cvcheck|choice|stopped   (Profile chapter, 1280x820)
          |recap|recap-nopdf                                                                         (the app, 1280x820)
   &theme=light|dark
   One centred card per step under the step dots, the setup stamp in its head, one primary per screen.
   The window grows once, at the Profile chapter, to the app's own size, and stays there through the recap.
   Grid.html's scoped styles, copied and scoped to .ob, so app.css and the other canvases are unchanged. Fictional data. */
body { margin: 0; }
.ob {
  --turn: #f48cc0; --on-turn: #0d1a2b; --card: #1a2f49; --grid: #1e3554; --mark: #5c3057;
  height: 100vh; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px; background-position: -1px -1px;
}
.ob[data-theme="light"] { --turn: #b0246a; --on-turn: #ffffff; --card: #ffffff; --grid: #d4dee9; --mark: #f4c2db; }
.ob .main { background: none; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.ob .btn { background: var(--card); }
.ob .btn.pri { background: var(--pri); }
/* Disabled, as the kit paints it: the opaque rest fill, ink and border at DISABLED_OPACITY. */
.ob .btn.off { color: color-mix(in srgb, var(--text) 50%, transparent); border-color: color-mix(in srgb, var(--line) 50%, transparent); cursor: default; }
.ob .btn.pri.off { background: color-mix(in srgb, var(--pri) 50%, var(--card)); border-color: transparent; color: var(--on-pri); }
.ob .btn.sm { height: 28px; padding: 0 8px; font-size: 13px; }
.ob .note13 { font-size: 13px; }
.ob .lnk { color: var(--active); text-decoration: underline; text-underline-offset: 2px; }
/* A quiet action: a link_button in the foot, after the primary. */
.ob .qlnk { padding: 0 6px; font-size: 14px; font-weight: 500; }
.ob b, .ob strong { font-weight: 600; }
.ob .slab { font-family: var(--slab); font-weight: 600; }
.ob .num { font-variant-numeric: tabular-nums; }

/* The window's top: the brand, and no menu until the app opens. */
.ob .menu { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 28px 4px; min-height: 42px; }
.ob .menu .brand { margin-right: 0; }
.ob .menu .brand svg path:last-child { stroke: var(--sheet); }
.ob .statusbar { flex: none; display: flex; align-items: center; gap: 18px; padding: 6px 28px; background: var(--sheet); box-shadow: inset 0 1px 0 var(--line); font-size: 13px; color: var(--muted); }
.ob .statusbar .r { margin-left: auto; }
.ob .sq { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }

/* Knots, as built (knot): Done and Failed in a hairline, the others filled. */
.ob .kn { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 2px; font-size: 12.5px; font-weight: 600; }
.ob .kn.done { background: var(--sheet); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.ob .kn.work, .ob .kn.next { background: var(--pri); color: var(--on-pri); }
.ob .kn.wait { background: var(--turn); color: var(--on-turn); }
.ob .kn.fail { background: var(--sheet); color: var(--closed); box-shadow: inset 0 0 0 1px var(--closed); }
.ob .kn.ahead { background: var(--panel); color: var(--muted); }
.ob .kn.add { background: var(--sheet); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

/* Paper, slips and the alert. In dark, panel and card are one color, so a slip on paper takes sheet there. */
.ob .paper { border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.ob .slip { border-radius: 4px; background: var(--panel); }
.ob .alertbox { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 4px; background: var(--panel); box-shadow: inset 3px 0 0 var(--closed); }
.ob .alertbox b { color: var(--closed); }
.ob[data-theme="dark"] .ccard .slip, .ob[data-theme="dark"] .ccard .alertbox, .ob[data-theme="dark"] .kn.ahead { background: var(--sheet); }

/* setup_line: a knot, the words and a line under them, a tag at the right. */
.ob .lines { display: flex; flex-direction: column; }
.ob .ln { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 1px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--line); }
.ob .ln:first-child { border-top: 0; }
.ob .ln .kn { grid-row: span 2; align-self: start; margin-top: 1px; }
.ob .ln .w { min-width: 0; }
.ob .ln .s { grid-column: 2; color: var(--muted); font-size: 13px; }
.ob .ln .end { grid-row: 1 / span 2; grid-column: 3; display: flex; align-items: center; gap: 8px; }
.ob .ln.dim .w { color: var(--muted); }
.ob .ln .barline { grid-column: 2 / span 2; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.ob .bar { flex: 1 1 auto; display: block; height: 8px; background: var(--off); }
.ob .bar i { display: block; height: 100%; background: var(--text); }
/* live_sweep, as on the run band, along the bottom of the line Claude works on. A still frame. */
.ob .ln.live { position: relative; }
.ob .ln.live::after { content: ""; position: absolute; left: 30%; width: 30%; bottom: -1px; height: 2px; background: var(--active); }
.ob .tag { background: var(--card); }
.ob .wide .ln { padding: 9px 14px; }

/* choice_card: a pickable card with a radio, a title, an optional tag and a sentence. Picked takes the pick look. */
.ob .choice { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 12px; padding: 12px 14px; border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.ob .choice.on { background: var(--raised); box-shadow: inset 0 0 0 1px var(--text); }
.ob .choice .rd { grid-row: span 2; margin-top: 2px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--text); background: var(--field); display: flex; align-items: center; justify-content: center; }
.ob .choice.on .rd::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text); }
.ob .choice .t { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.ob .choice .d { color: var(--muted); font-size: 13.5px; }

/* The folder row: the place in Courier, the parent in faint and the name in text (path_label). */
.ob .place { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
.ob .fold { flex: none; width: 34px; height: 28px; color: var(--text); }

/* drop_zone: paper with a dashed line edge (SWEEP_DASH), mini pages, the words and Choose files…. */
.ob .drop { display: flex; align-items: center; gap: 20px; padding: 20px 22px; border-radius: 4px; background-color: var(--card);
  background-image: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px), repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px), repeating-linear-gradient(0deg, var(--line) 0 6px, transparent 6px 10px), repeating-linear-gradient(0deg, var(--line) 0 6px, transparent 6px 10px);
  background-size: 100% 1px, 100% 1px, 1px 100%, 1px 100%; background-position: 0 0, 0 100%, 0 0, 100% 0; background-repeat: no-repeat; }
.ob .drop .words { display: flex; flex-direction: column; gap: 4px; }
.ob .drop .words .slab { font-size: 19px; }
.ob .drop.slim { padding: 12px 16px; gap: 14px; }
.ob .stack { position: relative; flex: none; width: 92px; height: 104px; }
.ob .stack .mpage { position: absolute; }
/* The mini page, as in CV documents. */
.ob .mpage { flex: none; width: 66px; height: 92px; padding: 8px 7px; display: flex; flex-direction: column; gap: 4px; background: var(--page); border: 1px solid var(--line); border-radius: 1px; box-sizing: border-box; }
.ob .mpage i { display: block; height: 3px; background: var(--page-line); }
.ob .mpage i.h { height: 6px; width: 60%; background: var(--page-head); margin-bottom: 3px; }
.ob .mpage i.s { width: 70%; }
.ob .mpage.sm { width: 26px; height: 34px; padding: 4px 3px; gap: 2px; }
.ob .mpage.sm i { height: 2px; }
.ob .mpage.sm i.h { height: 3px; margin-bottom: 1px; }
/* NEW, file_list: one row per added file: the mini page, the name as plain text, its pages, Remove. */
.ob .files .fr { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; align-items: center; column-gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); }
.ob .files .fr:first-child { border-top: 0; }
.ob .files .fr .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The question card (AskUserQuestion): prompt_box_tone in stamp ink, as the question bar in Tasks. */
.ob .ask { display: flex; flex-direction: column; gap: 12px; margin-right: 5px; padding: 14px 16px 16px; border: 1px solid var(--turn); border-radius: 2px; background: var(--card); box-shadow: 5px 5px 0 var(--turn); }
.ob .ask .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.ob .tagt { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 2px; background: var(--turn); color: var(--on-turn); font-size: 12.5px; font-weight: 600; }
.ob .ask .q { font: 600 19px/1.25 var(--slab); }
.ob .ask .opts { display: flex; flex-direction: column; gap: 6px; }
.ob .ask .opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 1px 10px; padding: 7px 10px; border-radius: 3px; }
.ob .ask .opt.on { background: var(--raised); box-shadow: inset 3px 0 0 var(--text); }
.ob .ask .opt .rd { grid-row: span 2; margin-top: 2px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--text); background: var(--field); display: flex; align-items: center; justify-content: center; }
.ob .ask .opt.on .rd::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text); }
.ob .ask .opt .d { color: var(--muted); font-size: 13px; }
.ob .fld { min-height: 34px; padding: 0 8px; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 3px; background: var(--field); color: var(--faint); box-sizing: border-box; }
.ob .fld.typed { color: var(--text); }
.ob .fld.grow { display: block; padding: 6px 8px; line-height: 1.45; }
.ob .fld.focus { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.ob .caret { display: inline-block; width: 1px; height: 17px; margin-left: 1px; vertical-align: -3px; background: var(--text); }
.ob .figs { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }

/* The foot of the open step: the primary first, then plain, then one muted line at the right, as the deal footer. */
.ob .foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 18px 12px; border-top: 1px solid var(--line); }
.ob .foot .why { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); line-height: 1.4; max-width: 52%; }

/* ---------- The wizard ---------- */
.ob .cw { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 24px 18px; }
/* step_dots: one STATUS_DOT square per step with its name under it, joined by a hairline. Done in text, the open
   one ringed in text, the rest unlit in off. */
.ob .sds { flex: none; display: flex; align-items: flex-start; }
.ob .sd { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 86px; font-size: 12.5px; color: var(--muted); }
.ob .sd i { position: relative; z-index: 1; display: block; width: 8px; height: 8px; margin-top: 4px; background: var(--off); }
.ob .sd.done i { background: var(--text); }
.ob .sd.on i { background: var(--text); outline: 1px solid var(--text); outline-offset: 2px; }
.ob .sd.on { color: var(--text); font-weight: 600; }
.ob .sd::before { content: ""; position: absolute; top: 7px; left: -43px; width: 86px; height: 1px; background: var(--line); }
.ob .sd.done::before, .ob .sd.on::before { background: var(--text); }
.ob .sd:first-child::before { display: none; }
.ob .sd span { padding: 0 4px; background: var(--sheet); }
.ob .ccard { width: 100%; max-width: 640px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 6px 6px 0 var(--line); }
.ob .ccard .body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px 22px 14px; overflow: hidden; }
.ob .ccard .hd { flex: none; display: flex; align-items: center; gap: 16px; }
.ob .ccard h1 { margin: 0; font: 600 26px/1.15 var(--slab); }
.ob .ccard .lead { margin-top: 4px; font-size: 14px; color: var(--muted); }
.ob .ccard .drop { padding: 16px 18px; }
.ob .stampsm { flex: none; width: 64px; height: 64px; }

/* The Profile chapter: the same card, wider, in the app-sized window. A main column and a side column (SPLIT_*). */
.ob .wide .ccard { max-width: 1120px; }
.ob .wide .ccard .body { padding: 18px 24px 0; gap: 14px; }
.ob .osplit { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; }
.ob .osplit.even { grid-template-columns: minmax(0, 1fr) minmax(0, 0.86fr); }
.ob .ocol { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.ob .oside { min-height: 0; display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
.ob .oside .slip { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ob .oside .sh { font: 600 17px/1.3 var(--slab); display: flex; align-items: baseline; gap: 8px; }
.ob .oside .sh .n { margin-left: auto; font: 400 13px/1.3 "Schibsted Grotesk", system-ui, sans-serif; color: var(--muted); }
.ob .oside p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.ob .tl { display: flex; gap: 3px; }
.ob .tl i { display: block; width: 6px; height: 18px; background: var(--text); }
.ob .tl i.o { background: var(--off); }

/* A scrolling well: the part of the card that scrolls, with the kit's thin bar at the right. */
.ob .well { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.ob .well .in { padding-right: 22px; }
.ob .well::after { content: ""; position: absolute; top: 4px; right: 2px; width: 6px; height: var(--thumb, 40%); border-radius: 3px; background: var(--line); }
.ob .well .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: linear-gradient(transparent, var(--card)); }

/* Claude's message as a document: markdown, no images, headings capped at the section size, at DOC_MEASURE. */
.ob .doc { max-width: 620px; padding: 0; font-size: 15px; line-height: 1.5; color: var(--text); }
.ob .doc h2 { margin: 0 0 6px; font: 600 17px/1.3 var(--slab); }
.ob .doc p { margin: 0 0 10px; }
.ob .doc .g { margin: 14px 0 6px; font-weight: 600; }
.ob .doc ol { margin: 0 0 6px; padding: 0; list-style: none; }
.ob .doc ol li { display: grid; grid-template-columns: 28px minmax(0, 1fr); margin-bottom: 6px; padding-left: 0; }
.ob .doc ol li::before { content: none; }
.ob .doc ol li > .qn { color: var(--muted); }
/* NEW, question_sheet (B2): each numbered item of Claude's message, then its own answer field. */
.ob .qs ol li { margin-bottom: 12px; }
.ob .qs li .fld { margin-top: 6px; font-size: 14px; }

/* B1: one large field, pre-numbered to match the message. */
.ob .bigf { flex: 1 1 auto; min-height: 0; padding: 8px 10px; border: 1px solid var(--text); box-shadow: 0 0 0 1px var(--text); border-radius: 3px; background: var(--field); font-size: 14px; line-height: 1.5; overflow: hidden; }
.ob .bigf div { margin-bottom: 4px; }
.ob .bigf .k { color: var(--muted); }
.ob .lab { font-size: 13px; font-weight: 600; }
.ob .help { font-size: 13px; color: var(--muted); }

/* NEW, cv_check: the CV pages from ProfileCv, at the page tokens. */
.ob .cvpages { display: flex; gap: 12px; align-items: flex-start; }
.ob .cvpw { display: flex; flex-direction: column; gap: 5px; }
.ob .cvpw .cap { font-size: 12.5px; color: var(--faint); }
.ob .cvpg { position: relative; overflow: hidden; width: 294px; height: 416px; background: var(--page); border: 1px solid var(--line); border-radius: 1px; }
.ob .art { position: absolute; left: 0; top: 0; width: 420px; height: 594px; transform: scale(0.7); transform-origin: 0 0; padding: 36px 38px; box-sizing: border-box; color: var(--page-head); font-family: "Schibsted Grotesk", system-ui, sans-serif; }
.ob .art .nm { font: 600 34px/1.05 var(--slab); }
.ob .art .ro { margin-top: 4px; font-size: 14px; }
.ob .art .sec { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; font: 600 16px/1 var(--slab); }
.ob .art .sec::before { content: ""; width: 52px; height: 4px; background: var(--page-head); }
.ob .art .en { display: grid; grid-template-columns: 52px 1fr; column-gap: 10px; margin-bottom: 10px; }
.ob .art .en b { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; }
.ob .art i { display: block; height: 4px; margin: 0 0 5px; background: var(--page-line); }
.ob .art i.d { width: 44px; }
.ob .art .two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }

/* ---------- First open ---------- */
.ob .hello { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 6px 32px 18px; }
.ob .hello h1 { margin: 0; font: 600 34px/1.1 var(--slab); }
.ob .hello .lead { margin-top: 6px; font-size: 15px; color: var(--muted); }
.ob .hello .choices { display: flex; flex-direction: column; gap: 8px; }
.ob .hello .go { display: flex; align-items: center; gap: 12px; margin-top: auto; }
.ob .hello .go .why { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }

/* ---------- Recap: the full app around the card, as today's first-run card ---------- */
.ob .tabs { display: flex; gap: 6px; }
.ob .tabs a { position: relative; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; color: var(--muted); font-weight: 500; }
.ob .tabs a .lbl { position: relative; z-index: 0; display: inline-block; font-size: 14px; line-height: 20px; }
.ob .tabs a.on { color: var(--text); font-weight: 600; }
.ob .tabs a.on .lbl::before { content: ""; position: absolute; z-index: -1; left: -6px; right: -6px; bottom: -1px; height: 14px; background: var(--mark); box-shadow: inset 0 -2px 0 var(--turn); }
.ob .tabs a.off { opacity: .55; }
.ob .newtask { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--text); font-weight: 500; }
.ob .newtask .keys { color: var(--muted); }
.ob .welcome { flex: 1 1 auto; display: flex; justify-content: center; align-items: flex-start; padding: 28px 32px 0; }
.ob .wcard { width: 620px; display: flex; flex-direction: column; border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 6px 6px 0 var(--line); }
.ob .wcard .body { display: flex; flex-direction: column; gap: 12px; padding: 22px 26px 16px; }
.ob .wcard h1 { margin: 0; font: 600 34px/1.1 var(--slab); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const STATE = (P.get('state') || 'welcome').toLowerCase();
const THEME = (P.get('theme') || 'light').toLowerCase();
const MARK = '<svg xmlns="http://www.w3.org/2000/svg" width="26" aria-hidden="true" viewBox="186 216 652 600"><path d="M206 272a36 36 0 0 1 36-36h228a36 36 0 0 1 36 36v28h276a36 36 0 0 1 36 36v424a36 36 0 0 1-36 36H242a36 36 0 0 1-36-36Z" fill="currentColor"></path><path d="M596 408V596a96 96 0 0 1-96 96H392" fill="none" stroke="var(--bg)" stroke-width="86"></path></svg>';
// A plain folder, drawn from the brand mark's folder without the J.
const FOLDER = '<svg class="fold" viewBox="186 216 652 600" aria-hidden="true"><path d="M206 272a36 36 0 0 1 36-36h228a36 36 0 0 1 36 36v28h276a36 36 0 0 1 36 36v424a36 36 0 0 1-36 36H242a36 36 0 0 1-36-36Z" fill="none" stroke="currentColor" stroke-width="40"></path></svg>';
const kb = (k) => `<span class="kb">${k}</span>`;
const kn = (t, s) => `<span class="kn ${s}">${t}</span>`;
const tag = (t, tone) => `<span class="tag c-${tone}">${t}</span>`;
const page = (sm, style) => `<span class="mpage${sm ? ' sm' : ''}" aria-hidden="true"${style ? ` style="${style}"` : ''}><i class="h"></i><i></i><i class="s"></i><i></i><i></i><i class="s"></i>${sm ? '' : '<i></i><i class="s"></i><i></i>'}</span>`;
const path = (dir, name) => `<span class="mono"><span class="faint">${dir}</span>${name}</span>`;
const PLACE = path('Documents/', 'Job search');
// The run's real spend so far, as This run counts it, and Elapsed. Never an estimate of the whole.
const SPEND = (d, t) => `About $${d} so far, on your Claude plan · ${t}`;

// The day stamp's rings (day_stamp), reused as the setup stamp: one tick per step, lit as each is done, the step inside.
function stamp(ticks, lit, top, mid, bot, spoken) {
  const t = [];
  for (let i = 0; i < ticks; i++) {
    const a = -Math.PI / 2 + (i + 0.5) * (2 * Math.PI / ticks);
    const c = (r) => [40 + r * Math.cos(a), 40 + r * Math.sin(a)].map((v) => v.toFixed(1));
    const [x1, y1] = c(29.5), [x2, y2] = c(36);
    t.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i < lit ? 'var(--text)' : 'var(--off)'}" stroke-width="4.5"/>`);
  }
  const edge = lit ? 'var(--text)' : 'var(--line)';
  return `<svg class="stampsm" viewBox="0 0 80 80" role="img" aria-label="${spoken}">
    <circle cx="40" cy="40" r="38.5" fill="var(--sheet)"/>${t.join('')}
    <circle cx="40" cy="40" r="38.5" fill="none" stroke="${edge}"/><circle cx="40" cy="40" r="27" fill="none" stroke="${edge}"/>
    <text x="40" y="28" text-anchor="middle" font-size="11.9" font-family="Schibsted Grotesk, sans-serif" fill="var(--muted)">${top}</text>
    <text x="40" y="48.5" text-anchor="middle" font-size="24.8" font-weight="600" font-family="Zilla Slab, serif" fill="var(--text)">${mid}</text>
    <text x="40" y="61" text-anchor="middle" font-size="11.9" font-family="Schibsted Grotesk, sans-serif" fill="var(--muted)">${bot}</text></svg>`;
}

// The three helpers, by purpose, with their size and time in plain words. All install in the user's home folder.
function toolRows(st) {
  const rows = [
    ['1', 'Keeps your tracker', 'Python', 'about 40 MB, under a minute', st.py],
    ['2', 'Searches job sites', 'Bun', 'about 30 MB, under a minute', st.bun],
    ['3', 'Makes your CV and cover letter PDFs', 'LaTeX', 'about 250 MB, the slow one: 5 to 15 minutes', st.tex],
  ];
  return `<div class="paper lines">${rows.map(([n, what, name, size, s]) => {
    const look = {
      checking: ['work', tag('Checking…', 'plain')], wait: ['ahead', '<span class="muted note13">Next</span>'],
      found: ['done', tag('Already here', 'hired')], installed: ['done', tag('Installed', 'hired')],
      installing: ['work', tag('Installing…', 'active')], failed: ['fail', tag('Could not install', 'closed')],
    }[s.k];
    const bar = s.k === 'installing' ? `<div class="barline"><span class="bar"><i style="width: ${s.pct}%"></i></span><span class="muted note13" style="white-space: nowrap">${s.note}</span></div>` : '';
    const sub = s.k === 'failed' ? `<span class="s" style="color: var(--closed)">${name}. ${s.note}</span>`
      : `<span class="s">${name}${s.k === 'installing' ? `, ${size}` : ''}</span>`;
    return `<div class="ln${s.k === 'wait' ? ' dim' : ''}">${kn(n, look[0])}<b class="w">${what}</b>${sub}<span class="end">${look[1]}</span>${bar}</div>`;
  }).join('')}</div>`;
}

const li = (n, inner) => `<li><span class="qn">${n}.</span><span>${inner}</span></li>`;

// B1: the message as it came, its headings, bold lines and numbered items kept.
function batchDoc() {
  return `<div class="doc">${INTRO2}${BATCH2.map(([g, qs]) => `<p class="g">${g}</p><ol>${qs.map(([n, q]) => li(n, q)).join('')}</ol>`).join('')}</div>`;
}

// B2: the same message, with one field under each numbered item. The field grows with its text.
function batchSheet(items = BATCH2, intro = INTRO2, focus = 13) {
  return `<div class="doc qs">${intro}${items.map(([g, qs]) => `${g ? `<p class="g">${g}</p>` : ''}<ol>${qs.map(([n, q, a]) => {
    const opt = /\(optional\)$/.test(q);
    const f = a
      ? `<span class="fld typed grow${n === focus ? ' focus' : ''}">${a}${n === focus ? '<span class="caret"></span>' : ''}</span>`
      : `<span class="fld">${opt ? 'Optional. Leave it empty to skip.' : 'Your answer'}</span>`;
    return li(n, q + f);
  }).join('')}</ol>`).join('')}</div>`;
}

}

    pri: 'Send answer', sec: 'Decline', why: SPEND('3.10', '27:02'),
  }),
  stopped: () => ({
    ch: 3, wide: true, title: 'Setup stopped partway', lead: 'Nothing is lost. Claude picks up where it stopped.',
    body: `<div class="osplit"><div class="ocol"><div class="alertbox"><b>Claude stopped while writing your profile.</b><span>The connection to Claude dropped.</span></div>` + lines([
      ['1', 'done', 'Reading your documents', '2 files', tag('Done', 'hired')],
      ['2', 'done', 'Answering Claude\'s questions', '2 rounds, all saved', tag('Done', 'hired')],
      ['3', 'fail', 'Writing your profile', 'Stopped partway', tag('Stopped', 'closed')],
      ['4', 'ahead', 'Making your CV'],
      ['5', 'ahead', 'Choosing job sites and search terms'],
    ], 'wide') + `<div class="figs">$2.71 used so far, on your Claude plan</div></div>
      <div class="oside"><section class="slip"><div class="sh">What is kept</div><p>Your documents, your answers and every change Claude already wrote are in your folder.</p>
        <p>Finish later opens Jobdesk. The next time you open it, setup offers to pick up here.</p></section></div></div>`,
    pri: 'Pick up where it stopped', sec: 'Finish later', why: 'Keeps stopping? <a class="lnk" href="#">Get help</a>',
  }),

  // ---------- The recap, in the app ----------
  recap: () => recapCard(false),
  'recap-nopdf': () => recapCard(true),
};

function recapCard(nopdf) {
  const tick = (n, s, title, sub, end) => `<div class="ln">${kn(n, s)}<b class="w">${title}</b><span class="s">${sub}</span><span class="end">${end || ''}</span></div>`;
  return {
    recap: true, nopdf, title: 'Your job search is ready',
    lead: nopdf ? 'Here is what Jobdesk set up. PDFs come once LaTeX is installed.' : 'Here is what Jobdesk set up. You can change any of it later.',
    body: `<div class="paper lines">
        ${tick('1', 'done', 'Folder saved', PLACE, '<a class="lnk note13" href="#">Show in Finder</a>')}
        ${nopdf ? tick('2', 'fail', 'This computer is almost ready', 'Python and Bun are installed. LaTeX is not, so PDFs are not ready yet.', tag('Not yet', 'plain'))
          : tick('2', 'done', 'This computer is ready', 'Python, Bun and LaTeX are installed.')}
        ${tick('3', 'done', 'Profile written: 9 of 11 topics', 'Finish the other 2 in Profile when you like.', `<span class="tally fat" role="img" aria-label="9 of 11 filled">${'<i></i>'.repeat(9)}${'<i class="off"></i>'.repeat(2)}</span>`)}
        ${nopdf ? tick('4', 'ahead', 'Your CV is written', 'Its PDF comes once LaTeX is installed.')
          : tick('4', 'done', 'Your CV is made', 'Checked by you: Sample_Candidate_CV.pdf', '<a class="lnk note13" href="#">Open PDF</a>')}
        ${tick('5', 'done', 'Job sites chosen', 'LinkedIn and Freehire, for Germany.')}
        <div class="ln">${kn('+', 'add')}<span class="w">Use a job site that is not listed?</span><span class="s">Claude can add it as a new search, from the site's address.</span><span class="end"><a class="lnk note13" href="#">Add a job site you use…</a></span></div>
      </div>
      <div class="figs"><span>Setup took 41 minutes and used $4.12 of your Claude plan.</span></div>`,
    pri: 'Open Jobdesk', why: nopdf ? 'Setup stays in the menu until LaTeX is installed.' : 'Today suggests your first search.',
  };
}

function foot(s) {
  const pri = s.pri ? `<button class="btn pri${s.priOff ? ' off' : ''}" type="button">${s.pri}</button>` : '';
  const sec = s.sec ? `<button class="btn" type="button">${s.sec}</button>` : '';
  const quiet = s.quiet ? `<a class="lnk qlnk" href="#">${s.quiet}</a>` : '';
  return `<div class="foot">${pri}${sec}${quiet}<span class="why">${s.why || ''}</span></div>`;
}

function statusbar(text) {
  return `<footer class="statusbar"><span><span class="sq" style="background: var(--hired)"></span>${text}</span><span class="r">Settings <span class="keys">Cmd ,</span></span></footer>`;
}

const topbar = () => `<header class="menu"><div class="brand">${MARK}Jobdesk</div></header>`;

// ---------- First open, and the next open after quitting midway, in the small window. ----------
function welcome() {
  const scratch = `<div class="choice on"><span class="rd"></span><span class="t">Set up from scratch ${tag('Recommended', 'plain')}</span>
      <span class="d">Jobdesk makes your job search folder, gets this computer ready and builds your profile from your CV. About 40 minutes, most of it answering Claude's questions about you.</span></div>`;
  const have = `<div class="choice"><span class="rd"></span><span class="t">I already have an ai-job-search folder</span><span class="d">Choose it, and Jobdesk opens it as it is.</span></div>`;
  const words = '<h1>Welcome to Jobdesk</h1><p class="lead">Your job search as a short list of decisions. Claude does the legwork, and nothing runs until you say so.</p>';
  return `<div class="app ob" data-theme="${THEME}">${topbar()}
    <main class="main"><div class="hello"><div class="row" style="gap: 18px; align-items: center">${stamp(12, 0, 'Tue', '10', 'Nov', 'Tuesday 10 November')}<div>${words}</div></div>
      <div class="choices">${scratch}${have}</div>
      <div class="go"><button class="btn pri" type="button">Start setup</button><span class="why">Each step says what it does before it does it.<br>Quit any time: setup picks up where you stopped.</span></div>
    </div></main>${statusbar('Claude Code is signed in. Jobdesk uses it for every task.')}</div>`;
}

function resume() {
  return `<div class="app ob" data-theme="${THEME}">${topbar()}
    <main class="main"><div class="hello"><div class="row" style="gap: 18px; align-items: center">${stamp(4, 2, 'Step', '3', 'of 4', 'Step 3 of 4. 2 of 4 steps done.')}<div>
      <h1>Welcome back</h1><p class="lead">Your folder and tools are ready. Let's finish your profile.</p></div></div>
      ${lines([
        ['1', 'done', 'Folder', PLACE, tag('Done', 'hired')],
        ['2', 'done', 'Computer', 'Python, Bun and LaTeX are ready.', tag('Done', 'hired')],
        ['3', 'next', 'Profile', 'You stopped at Claude\'s questions. Your draft answers are kept.', ''],
        ['4', 'ahead', 'Done'],
      ])}
      <div class="go"><button class="btn pri" type="button">Finish my profile</button><span class="why">You stopped on Tuesday 10 November.<br>$1.36 used so far, on your Claude plan.</span></div>
    </div></main>${statusbar('Claude Code is signed in. Jobdesk uses it for every task.')}</div>`;
}

// ---------- One card per step. Small window for Folder and Computer, app-sized for Profile. ----------
function wizard(s) {
  const dots = STEPS.map((n, i) => `<div class="sd${i + 1 < s.ch ? ' done' : i + 1 === s.ch ? ' on' : ''}"><i></i><span>${n}</span></div>`).join('');
  return `<div class="app ob" data-theme="${THEME}">${topbar()}
    <main class="main"><div class="cw${s.wide ? ' wide' : ''}"><nav class="sds" aria-label="Step ${s.ch} of 4, ${STEPS[s.ch - 1]}">${dots}</nav>
      <section class="ccard"><div class="body">
        <div class="hd">${stamp(4, s.ch - 1, 'Step', s.ch, 'of 4', `Step ${s.ch} of 4`)}<div><h1>${s.title}</h1><p class="lead">${s.lead}</p></div></div>
        ${s.body}</div>${foot(s)}</section>
    </div></main></div>`;
}

function recap(s) {
  const names = ['Today', 'Jobs', 'Applications', 'Insights', 'Tasks', 'Profile'].concat(s.nopdf ? ['Setup'] : []);
  const tabs = names.map((t) => `<a class="${t === 'Today' ? 'on' : 'off'}" href="#"><span class="lbl">${t}</span></a>`).join('');
  return `<div class="app ob" data-theme="${THEME}">
    <header class="menu" style="gap: 28px"><div class="brand">${MARK}Jobdesk</div><nav class="tabs" aria-label="Main">${tabs}</nav><span class="newtask" style="opacity: .55">New task <span class="keys">Cmd K</span></span></header>
    <main class="main"><div class="welcome"><section class="wcard"><div class="body">
      <div class="row" style="gap: 18px">${stamp(4, s.nopdf ? 3 : 4, 'Tue', '10', 'Nov', `Set up on Tuesday 10 November. ${s.nopdf ? 3 : 4} of 4 steps done.`)}<div><h1>${s.title}</h1><p class="lead muted" style="font-size: 15px; margin-top: 4px">${s.lead}</p></div></div>
      ${s.body}</div>${foot(s)}</section></div></main>${statusbar('Claude is ready')}</div>`;
}

const root = document.getElementById('root');
if (STATE === 'resume') root.innerHTML = resume();
else if (STATE === 'welcome' || !S[STATE]) root.innerHTML = welcome();
else {
  const s = S[STATE]();
  root.innerHTML = s.recap ? recap(s) : wizard(s);
}
</script>
</body>
</html>
