# Builds the macOS DMG and the Windows setup as the artifacts `dmg` and `setup`. It never publishes.
# tag-release.yml calls it on the merge commit of a release PR, then tags and publishes.
# Run it from the Actions tab to build the installers of a branch without a release.
# A manual run with `quick` skips clippy and tests, and labels the files `-untested`.
# tag-release.yml has no `quick` input, so a release always tests.
# The installers are not signed with a developer identity: see the Install section of README.md and the Package
# section of CONTRIBUTING.md. With the update key in the secrets JOBDESK_UPDATE_KEY and JOBDESK_UPDATE_KEY_PASSWORD,
# cargo packager signs the update files, and `dmg` and `setup` carry them and their .sig files too.
# A release needs the key: with a tag set, a missing key fails the build.
name: Installers

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        type: string
        required: true
      tag:
        description: The release tag, vX.Y.Z. It must match the Cargo.toml version and names the files.
        type: string
        required: false
        default: ''
    secrets:
      JOBDESK_UPDATE_KEY:
        description: The update signing key, as cargo packager signer generate wrote it.
        required: false
      JOBDESK_UPDATE_KEY_PASSWORD:
        description: The password of the update signing key.
        required: false
  workflow_dispatch:
    inputs:
      quick:
        description: Skip clippy and tests, for a fast untested build.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: '0.11.8'

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tests: ''
          # Screen snapshots are macOS baselines, so Windows builds and runs the tests with the snapshot compares skipped.
          - os: windows-latest
            tests: ''
    # Under workflow_call inputs.quick is null, so a release always runs this job.
    if: ${{ !inputs.quick }}
    runs-on: ${{ matrix.os }}
    steps:
      # A manual run has no `ref`, so it builds the commit the run started on.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked ${{ matrix.tests }}
      # A failing snapshot writes the new picture and its diff: keep them for review.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshots-${{ matrix.os }}
          path: |
            tests/snapshots/*.diff.png
            tests/snapshots/*.new.png
          if-no-files-found: ignore

  version:
    name: Read the app version
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.read.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Read the version and name the installers
        id: read
        env:
          TAG: ${{ inputs.tag }}
          QUICK: ${{ inputs.quick }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ -n "$TAG" ]; then
            if [ "v$version" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match Cargo.toml version $version"
              exit 1
            fi
            label="$TAG"
          else
            label="v$version-$(git rev-parse --short=7 HEAD)"
          fi
          if [ "$QUICK" = "true" ]; then
            label="$label-untested"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

  package:
    name: Build ${{ matrix.artifact }}
    needs: [version, test]
    # Runs when a quick build skips test, never when a need failed.
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # update is the file a copy of Jobdesk downloads to update itself, and update_suffix its name.
          # On Windows it is the setup itself.
          - os: macos-latest
            formats: app,dmg
            artifact: dmg
            built: '*.dmg'
            suffix: macos-arm64.dmg
            update: Jobdesk.app.tar.gz
            update_suffix: macos-arm64.app.tar.gz
          - os: windows-latest
            formats: nsis
            artifact: setup
            built: '*-setup.exe'
            suffix: windows-x64-setup.exe
            update: ''
            update_suffix: windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      # cargo packager signs what it builds only when CARGO_PACKAGER_SIGN_PRIVATE_KEY is set, so it is set only with a key.
      - name: Package
        env:
          FORMATS: ${{ matrix.formats }}
          TAG: ${{ inputs.tag }}
          UPDATE_KEY: ${{ secrets.JOBDESK_UPDATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.JOBDESK_UPDATE_KEY_PASSWORD }}
        run: |
          if [ -n "$UPDATE_KEY" ] && [ -z "$UPDATE_KEY_PASSWORD" ]; then
            echo "::error::JOBDESK_UPDATE_KEY is set but JOBDESK_UPDATE_KEY_PASSWORD is empty. Set both, as the Release section of CONTRIBUTING.md says."
            exit 1
          fi
          if [ -n "$TAG" ] && [ -z "$UPDATE_KEY" ]; then
            echo "::error::A release needs the update key. Set the JOBDESK_UPDATE_KEY and JOBDESK_UPDATE_KEY_PASSWORD secrets, as the Release section of CONTRIBUTING.md says."
            exit 1
          fi
          if [ -n "$UPDATE_KEY" ]; then
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$UPDATE_KEY"
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="$UPDATE_KEY_PASSWORD"
          fi
          cargo packager --release --formats "$FORMATS"
      - name: Name the installer and the update
        env:
          BUILT: ${{ matrix.built }}
          NAME: Jobdesk-${{ needs.version.outputs.label }}-${{ matrix.suffix }}
          UPDATE: ${{ matrix.update }}
          UPDATE_NAME: Jobdesk-${{ needs.version.outputs.label }}-${{ matrix.update_suffix }}
          SIGNED: ${{ secrets.JOBDESK_UPDATE_KEY != '' }}
        run: |
          # bash 3.2 on macOS has no mapfile; compgen exits 1 on no match.
          files=()
          while IFS= read -r f; do
            if [ -n "$f" ]; then files+=("$f"); fi
          done < <(compgen -G "target/packages/$BUILT" || true)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one $BUILT in target/packages, found ${#files[@]}."
            exit 1
          fi
          mkdir -p dist
          mv "${files[0]}" "dist/$NAME"
          if [ "$SIGNED" != "true" ]; then
            exit 0
          fi
          # The update and its signature. On macOS the update is the app bundle as a .tar.gz, on Windows the setup itself.
          if [ -n "$UPDATE" ]; then
            update="target/packages/$UPDATE"
            signature="$update.sig"
          else
            update="dist/$NAME"
            signature="${files[0]}.sig"
          fi
          for file in "$update" "$signature"; do
            if [ ! -s "$file" ]; then
              echo "::error::cargo packager did not write $file."
              exit 1
            fi
          done
          if [ -n "$UPDATE" ]; then
            mv "$update" "dist/$UPDATE_NAME"
          fi
          mv "$signature" "dist/$UPDATE_NAME.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
