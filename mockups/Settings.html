<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&amp;family=Zilla+Slab:wght@600&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
/* Settings, a full screen. Choose with ?state=…&theme=light|dark.
   usage|usage-empty|loading|providers|key-entry|key-saved|key-failed|terms|terms-missing|terms-failed|
   general|appearance|queue|jobs|defaults|cap|perms|runtime|data|about|search, and the Setup tab in the menu: nav.
   Grid.html's scoped shell, copied under .st, so app.css and the other canvases are unchanged. Fictional data only. */
body { margin: 0; }
.st {
  --turn: #f48cc0; --on-turn: #0d1a2b; --card: #1a2f49; --grid: #1e3554; --mark: #5c3057;
  height: 100vh; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px; background-position: -1px -1px;
}
.st[data-theme="light"] { --turn: #b0246a; --on-turn: #ffffff; --card: #ffffff; --grid: #d4dee9; --mark: #f4c2db; }
.st .main { background: none; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; position: relative; }
.st .num { font-variant-numeric: tabular-nums; }

/* Shell, as Grid.html draws it. */
.st .menu { flex: none; display: flex; align-items: center; gap: 28px; padding: 14px 28px 4px; }
.st .menu .brand { margin-right: 0; }
.st .menu .brand svg path:last-child { stroke: var(--sheet); }
.st .tabs { display: flex; gap: 6px; }
.st .tabs a { position: relative; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; color: var(--muted); font-weight: 500; }
.st .tabs a .lbl { position: relative; z-index: 0; display: inline-block; font-size: 14px; line-height: 20px; }
.st .tabs a.on { color: var(--text); font-weight: 600; }
.st .tabs a.on .lbl::before { content: ""; position: absolute; z-index: -1; left: -6px; right: -6px; bottom: -1px; height: 14px; background: var(--mark); box-shadow: inset 0 -2px 0 var(--turn); }
.st .chip { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 2px; background: var(--turn); color: var(--on-turn); font-size: 12.5px; font-weight: 600; }
.st .newtask { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--text); font-weight: 500; }
.st .newtask .keys { color: var(--muted); }
.st .statusbar { flex: none; display: flex; align-items: center; gap: 18px; padding: 6px 28px; background: var(--sheet); box-shadow: inset 0 1px 0 var(--line); font-size: 13px; color: var(--muted); }
.st .sq { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }
/* NEW status_button: the Settings entry where the theme switch stood. A status segment's size, with its chord in muted. */
.st .sbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: 3px; color: var(--muted); font-size: 12.5px; font-weight: 500; }
.st .sbtn .keys { font: 500 12.5px/1 "Schibsted Grotesk", system-ui, sans-serif; color: var(--muted); }
.st .sbtn.on { background: var(--raised); color: var(--text); font-weight: 600; }

/* Controls, as UiPass.html draws them. */
.st .b { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--text); font-weight: 500; white-space: nowrap; position: relative; }
.st .b.sm { height: 28px; padding: 0 8px; font-size: 13px; }
.st .b.pri { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.st .b.bad { color: var(--closed); border-color: var(--closed); }
.st .b.on { background: var(--text); border-color: var(--text); color: var(--sheet); font-weight: 600; }
.st .b .keys { color: var(--muted); font: 500 13px/1 "Schibsted Grotesk", system-ui, sans-serif; }
.st .b.pri .keys, .st .b.on .keys { color: inherit; }
.st .b .kb { color: var(--muted); }
.st .b.dis { color: color-mix(in srgb, var(--text) 50%, var(--card)); border-color: color-mix(in srgb, var(--line) 50%, var(--card)); }
.st .b.pri.dis { background: color-mix(in srgb, var(--pri) 50%, var(--card)); border-color: transparent; color: var(--card); }
.st .b.onpanel { background: var(--panel); }
.st .b.pri.onpanel.dis { background: color-mix(in srgb, var(--pri) 50%, var(--panel)); color: var(--panel); }
.st .b.foc, .st .foc { outline: 2px solid var(--active); outline-offset: 1px; }
.st .lk { display: inline-flex; align-items: center; height: 24px; color: var(--active); font-size: 13px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; white-space: nowrap; }
.st .tip { position: absolute; z-index: 5; max-width: 270px; padding: 6px 9px; border: 1px solid var(--text); border-radius: 4px; background: var(--sheet); box-shadow: 6px 6px 0 var(--line); color: var(--text); font-size: 13px; line-height: 1.4; font-weight: 400; white-space: normal; }
.st .ptr { position: absolute; z-index: 6; width: 18px; height: 22px; pointer-events: none; }
.st .path { font: 400 13.5px/1.3 var(--type); }
.st .fpath { font: 400 12.5px/1.3 var(--type); color: var(--faint); }
.st .togs { display: inline-flex; gap: 4px; }
/* A field on paper or a slip: field fill, line hairline. A combo box is a field with egui's small triangle. */
.st .fd { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); color: var(--text); white-space: nowrap; }
.st .fd .hint { color: var(--faint); font: inherit; padding: 0; border: 0; }
.st .fd.foc { border-color: var(--text); }
.st .fd .unit { color: var(--muted); }
.st .fd.cmb { justify-content: space-between; gap: 16px; padding: 0 10px; }
.st .fd.cmb::after { content: ""; flex: none; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--text); }
.st .fd.secret { font: 400 13.5px/1 var(--type); letter-spacing: 1px; }
.st .caret { display: inline-block; width: 1.5px; height: 17px; margin-left: -6px; background: var(--text); }
.st .cb { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 1px solid var(--text); border-radius: 2px; background: var(--field); }
.st .cb.on { background: var(--text); }
.st .cb svg { width: 12px; height: 12px; }
.st .rd { flex: none; width: 16px; height: 16px; margin-top: 2px; border: 1px solid var(--text); border-radius: 50%; background: var(--field); }
.st .rd.on { background: var(--text); box-shadow: inset 0 0 0 4px var(--field); }

/* The rail column and one page on paper. */
.st .amain { flex: 1 1 auto; min-height: 0; display: flex; gap: 16px; padding: 14px 32px 14px 28px; }
.st .rcol { flex: 0 0 280px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.st .rail { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; border-radius: 4px; background: var(--panel); }
.st .rail .sh { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 6px; font: 600 19px/1.3 var(--slab); }
.st .rail .sch { margin: 2px 14px 6px; }
.st .rail .sch .fd { width: 100%; }
.st .gt { padding: 10px 14px 3px; font-size: 13px; font-weight: 600; color: var(--muted); }
.st .tr { flex: none; display: flex; align-items: center; gap: 8px; height: 34px; margin: 0 6px; padding: 0 8px; border-radius: 3px; }
.st .tr .t { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st .tr .s { flex: none; font-size: 13px; color: var(--muted); }
.st .tr .s.f { color: var(--interview); font-weight: 600; }
.st .tr .s.x { color: var(--closed); font-weight: 600; }
.st .tr.on { background: var(--raised); box-shadow: inset 3px 0 0 var(--text); font-weight: 600; }
.st .tr.on .s { font-weight: 600; }
.st .rail .rfoot { margin-top: auto; padding: 10px 14px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); line-height: 1.4; }

.st .pg { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.st .pgh { position: relative; flex: none; display: flex; align-items: flex-end; gap: 16px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.st .pgh h1 { margin: 0; font: 600 32px/1.15 var(--slab); }
.st .pgh .lead { margin-top: 4px; font-size: 15px; color: var(--muted); max-width: 620px; }
.st .pgh .acts { margin-left: auto; display: flex; align-items: center; gap: 6px; padding-bottom: 2px; }
.st .pgb { flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; padding: 0 22px 18px; }
.st .bar-y { position: absolute; top: 6px; right: 4px; width: 6px; height: 52%; border-radius: 3px; background: var(--line); }
.st .pgf { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 22px 9px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); }
.st .pgf .r { margin-left: auto; color: var(--muted); }

/* A sub-section: a slab heading, an optional note, then setting rows with a hairline between. */
.st .sec { margin-top: 20px; }
.st .sec:first-child { margin-top: 14px; }
.st .sec > h2 { margin: 0; font: 600 17px/1.3 var(--slab); }
.st .sec > .sn { margin-top: 1px; font-size: 13px; color: var(--muted); }
.st .sec > h2 + .sr, .st .sec > .sn + .sr { margin-top: 6px; }
/* NEW setting_row: the label and one help line on the left, the control on the right. */
.st .sr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 32px; align-items: center; min-height: 58px; padding: 10px 0; border-top: 1px solid var(--line); }
.st .sr .lb { font-weight: 600; }
.st .sr .hp { margin-top: 2px; max-width: 560px; font-size: 13px; line-height: 1.4; color: var(--muted); }
.st .sr .ct { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.st .sr .val { font-weight: 600; text-align: right; }
.st .sr.chk { grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: start; }
.st .sr.chk .cb { margin-top: 1px; }
/* A search hit: the highlighter swipe without its rule, under the matched words. */
.st .hit { background: linear-gradient(transparent 45%, var(--mark) 45%, var(--mark) 100%); padding: 0 2px; margin: 0 -2px; }

/* Panels inside paper keep a line hairline, because card and panel are one colour in dark. */
.st .slp { border-radius: 4px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.st .nt { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 4px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.st .nt .r { margin-left: auto; }
.st .tag { height: 22px; font: 600 12.5px/1 "Schibsted Grotesk", system-ui, sans-serif; }
.st .tag.sm { height: 20px; padding: 0 6px; }

/* Usage: the band of figures, the per-application line, the year of days, two tables. */
.st .fband { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; border-radius: 4px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.st .fc { display: flex; flex-direction: column; gap: 3px; padding: 11px 16px 13px; border-left: 1px solid var(--line); min-width: 0; }
.st .fc:first-child { border-left: 0; }
.st .fc .k { font-weight: 500; color: var(--muted); }
.st .fc b { font: 600 34px/1.1 var(--slab); font-weight: 600; }
.st .fc .m { font-size: 13px; color: var(--muted); line-height: 1.35; }
.st .fc .fbar { height: 8px; margin: 4px 0 2px; background: var(--off); }
.st .fc .fbar i { display: block; height: 100%; background: var(--text); }
.st .per { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 4px 0 12px; border-bottom: 1px solid var(--line); }
.st .per b { font: 600 21px/1 var(--slab); }
.st .per .k { font-weight: 600; white-space: nowrap; }
.st .hmrow { display: flex; align-items: flex-start; gap: 32px; margin-top: 8px; }
.st .hm { flex: none; display: grid; grid-template-columns: 30px repeat(53, 8px); grid-template-rows: 16px repeat(7, 8px); gap: 3px; position: relative; }
.st .hmside { display: flex; flex-direction: column; gap: 5px; padding-top: 14px; font-size: 13px; color: var(--muted); }
.st .hmside b { font-weight: 600; color: var(--text); }
.st .hm .ml, .st .hm .dl { font-size: 12.5px; line-height: 8px; color: var(--muted); white-space: nowrap; }
.st .hm .ml { line-height: 14px; }
.st .hc { background: var(--raised); }
.st .hc.l1 { background: var(--line); }
.st .hc.l2 { background: var(--faint); }
.st .hc.l3 { background: var(--text); }
.st .hc.today { box-shadow: 0 0 0 1px var(--card), 0 0 0 2px var(--text); }
.st .hc.none { background: none; }
.st .legend { display: flex; align-items: center; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.st .legend .hc, .st .hmside .hc { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }
.st .two > .sec { margin-top: 20px; }
.st .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
.st .tb2 { width: 100%; border-collapse: collapse; margin-top: 6px; }
.st .tb2 th { text-align: left; padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--text); white-space: nowrap; }
.st .tb2 td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.st .tb2 tr:last-child td { border-bottom: 0; }
.st .tb2 th:first-child, .st .tb2 td:first-child { padding-left: 0; }
.st .tb2 .r { text-align: right; }
.st .share { display: inline-block; width: 70px; height: 8px; background: var(--off); vertical-align: 0; }
.st .share i { display: block; height: 100%; background: var(--text); }

/* Loading and failed, as Profile.html draws them. */
.st .sk { display: block; height: 12px; border-radius: 2px; background: var(--raised); }
.st .alert { flex: none; display: flex; align-items: flex-start; gap: 16px; padding: 12px 16px; border: 1px solid var(--closed); border-radius: 2px; background: var(--card); box-shadow: 5px 5px 0 var(--closed); margin-right: 5px; }
.st .alert .at { color: var(--closed); font-weight: 600; }
.st .empty { display: flex; flex-direction: column; gap: 12px; max-width: 560px; padding: 24px 0 18px; }
.st .empty h3 { margin: 0; font: 600 19px/1.25 var(--slab); }
.st .empty p { color: var(--muted); line-height: 1.45; font-size: 15px; }
.st .empty .row { gap: 10px; }
.st .faded { opacity: .8; }
.st .code { padding: 9px 11px; border-radius: 2px; background: var(--field); border: 1px solid var(--line); font: 400 13.5px/1.3 var(--type); white-space: pre; }

/* Providers: the ways to sign in on the left, the picked one in a slip on the right. */
.st .prov { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
.st .pr { display: flex; align-items: flex-start; gap: 10px; padding: 10px 10px 11px; border-top: 1px solid var(--line); }
.st .pr:first-child { border-top: 0; }
.st .pr .w { flex: 1 1 auto; min-width: 0; }
.st .pr .w b { font-weight: 600; display: block; }
.st .pr .w span { font-size: 13px; color: var(--muted); }
.st .pr.on { background: var(--raised); box-shadow: inset 3px 0 0 var(--text); }
.st .pr.off { opacity: .55; }
.st .det { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; }
.st .det h3 { margin: 0; font: 600 19px/1.25 var(--slab); display: flex; align-items: center; gap: 10px; }
.st .det p { line-height: 1.45; }
.st .kv { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 40px; border-top: 1px solid var(--line); }
.st .kv .k { color: var(--muted); font-size: 13px; }
.st .kv .acts { display: flex; gap: 6px; }
.st .lbl2 { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.st .bad-box { display: flex; flex-direction: column; gap: 8px; padding: 11px 14px 12px; border: 1px solid var(--closed); border-radius: 2px; background: var(--card); box-shadow: 5px 5px 0 var(--closed); margin-right: 5px; }
.st .bad-box .at { color: var(--closed); font-weight: 600; }

/* Run defaults: the per-command table. */
.st .ov td { padding-top: 5px; padding-bottom: 5px; }
.st .ov .fd { height: 30px; }

/* Data: the confirm popover, egui's window look. */
.st .popx { position: absolute; z-index: 5; display: flex; flex-direction: column; gap: 8px; width: 340px; padding: 12px 14px; border: 1px solid var(--text); border-radius: 4px; background: var(--sheet); box-shadow: 6px 6px 0 var(--line); }

/* The launcher's head on the grid. */
.st .bhead { flex: none; display: flex; align-items: flex-end; gap: 16px; padding: 16px 32px 12px; }
.st .bhead h1 { margin: 0; font: 600 32px/1.15 var(--slab); }
.st .bhead .sub { margin-top: 2px; color: var(--muted); }
.st .bhead .acts { margin-left: auto; }

/* The launcher, as built: the command list on paper, the form on a slip. */
.st .lbody { flex: 1 1 auto; min-height: 0; display: flex; gap: 28px; padding: 0 32px 14px; }
.st .clist { flex: 1 1 auto; min-width: 0; }
.st .crow2 { display: grid; grid-template-columns: 115px minmax(0, 1fr) auto; align-items: center; height: 34px; padding: 0 8px; border-top: 1px solid var(--line); }
.st .crow2.on { background: var(--raised); box-shadow: inset 3px 0 0 var(--text); }
.st .form { flex: 0 0 400px; align-self: flex-start; border-radius: 4px; background: var(--panel); }
.st .form .fh { padding: 8px 14px; font: 700 18px/1.3 var(--type); border-bottom: 1px solid var(--line); }
.st .form .fb { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }

/* The nav sheet. */
.st .nsheet { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 28px 16px; }
.st .nsheet > header h1 { margin: 0; font: 600 26px/1.15 var(--slab); }
.st .nsheet > header p { margin-top: 3px; color: var(--muted); max-width: 900px; }
.st .win { display: flex; flex-direction: column; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line), 6px 6px 0 var(--line); overflow: hidden; background-color: var(--sheet); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
.st .win .cap { display: flex; align-items: baseline; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.st .win .cap b { font: 600 17px/1.3 var(--slab); }
.st .win .ghost { height: 92px; margin: 6px 32px 14px; display: flex; gap: 16px; }
.st .win .ghost > div { border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const STATE = (P.get('state') || 'usage').toLowerCase();
const THEME = (P.get('theme') || 'light').toLowerCase();
const MARK = '<svg xmlns="http://www.w3.org/2000/svg" width="26" aria-hidden="true" viewBox="186 216 652 600"><path d="M206 272a36 36 0 0 1 36-36h228a36 36 0 0 1 36 36v28h276a36 36 0 0 1 36 36v424a36 36 0 0 1-36 36H242a36 36 0 0 1-36-36Z" fill="currentColor"></path><path d="M596 408V596a96 96 0 0 1-96 96H392" fill="none" stroke="var(--bg)" stroke-width="86"></path></svg>';
const ARROW = (x, y) => `<svg class="ptr" style="left:${x}px; top:${y}px" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 1.5v16l4.2-4 2.8 6.3 2.4-1-2.7-6.2h5.8z" fill="var(--page)" stroke="var(--page-head)" stroke-width="1.1" stroke-linejoin="round"/></svg>`;
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke="var(--sheet)" stroke-width="1.8"/></svg>';

const B = (t, cls = '', keys = '') => `<span class="b ${cls}">${t}${keys ? ` <span class="keys">${keys}</span>` : ''}</span>`;
const TAG = (t, tone, cls = '') => `<span class="tag c-${tone} ${cls}">${t}</span>`;
const cb = (on) => `<span class="cb${on ? ' on' : ''}" role="checkbox" aria-checked="${on}">${on ? TICK : ''}</span>`;
const togs = (opts, on) => `<span class="togs" role="radiogroup">${opts.map((o) => B(o, 'sm' + (o === on ? ' on' : ''))).join('')}</span>`;
const cmb = (t, w = 200) => `<span class="fd cmb" style="min-width: ${w}px">${t}</span>`;
const fd = (t, w = 120, cls = '') => `<span class="fd ${cls}" style="width: ${w}px">${t}</span>`;
const sr = (label, help, ctl) => `<div class="sr"><div><div class="lb">${label}</div>${help ? `<div class="hp">${help}</div>` : ''}</div><div class="ct">${ctl}</div></div>`;
const srChk = (on, label, help) => `<div class="sr chk">${cb(on)}<div><div class="lb">${label}</div>${help ? `<div class="hp">${help}</div>` : ''}</div></div>`;

const OCT = [2, 1, 0, 0, 3, 1, 2, 0, 1, 0, 1, 2, 4, 1, 0, 1, 0, 0, 2, 1, 3, 2, 0, 0, 0, 2, 1, 2, 1, 2, 2];
const DAY = 86400000;
const END = Date.UTC(2026, 9, 31); // Sat 31 Oct 2026, the canvases' today
const START = Date.UTC(2025, 9, 27); // the Monday 52 weeks before the last column
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function runsOn(t) {
  const d = new Date(t);
  if (t < Date.UTC(2026, 6, 13)) return 0; // the search began in mid July
  if (d.getUTCMonth() === 9) return OCT[d.getUTCDate() - 1];
  const n = d.getUTCDate() * 7 + d.getUTCMonth() * 13;
  const wd = d.getUTCDay();
  const r = (n * 2654435761 % 97) / 97;
  if (wd === 0 || wd === 6) return r > 0.8 ? 1 : 0;
  return r > 0.9 ? 4 : r > 0.62 ? 2 : r > 0.3 ? 1 : 0;
}
const level = (n) => n === 0 ? '' : n === 1 ? 'l1' : n <= 3 ? 'l2' : 'l3';
function heatmap(o = {}) {
  const cells = [];
  let lastMonth = -1;
  for (let c = 0; c < 53; c++) {
    const colStart = START + c * 7 * DAY;
    const m = new Date(colStart).getUTCMonth();
    if (m !== lastMonth && new Date(colStart).getUTCDate() <= 7) {
      cells.push(`<span class="ml" style="grid-row: 1; grid-column: ${c + 2} / span 4">${MONTHS[m]}</span>`);
      lastMonth = m;
    } else if (lastMonth === -1) lastMonth = m;
    for (let r = 0; r < 7; r++) {
      const t = colStart + r * DAY;
      const n = o.blank ? 0 : runsOn(t);
      const cls = t > END ? 'none' : level(n) + (t === END ? ' today' : '');
      cells.push(`<i class="hc ${cls}" style="grid-row: ${r + 2}; grid-column: ${c + 2}"></i>`);
    }
  }
  const days = [['Mon', 2], ['Wed', 4], ['Fri', 6]].map(([d, r]) => `<span class="dl" style="grid-row: ${r}; grid-column: 1">${d}</span>`).join('');
  let active = 0;
  for (let t = START; t <= END; t += DAY) if (!o.blank && runsOn(t) > 0) active++;
  const side = `<div class="hmside"><span>Last 12 months, one square a day</span>
      ${o.blank ? '<span>No task yet</span>' : `<span><b class="num">${active} days</b> with a task, since 13 July</span>`}
      <span style="margin-top: 6px"><i class="hc"></i>None</span><span><i class="hc l1"></i>1 task</span><span><i class="hc l2"></i>2 or 3 tasks</span><span><i class="hc l3"></i>4 or more</span></div>`;
  return `<div class="hmrow"><div class="hm" role="img" aria-label="Tasks per day over the last 12 months">${days}${cells.join('')}${o.tip || ''}</div>${side}</div>`;
}

      srChk(true, 'Day rate under your floor', 'EUR 700 a day, from Your terms.') +
      srChk(false, 'Too far to commute', 'In your Too far tier, and not fully remote.') +
      srChk(false, 'Language does not match', 'The posting asks for a language your profile does not list.')) +
    sec('Score and safety', '',
      `<div class="sr chk">${cb(true)}<div><div class="lb">Hide jobs scored under <span class="fd num" style="width: 64px; height: 28px; margin: 0 4px">60</span></div><div class="hp">Applies to every list on Jobs.</div></div></div>` +
      srChk(false, 'Hide jobs the safety check flagged', 'Flagged ads still wait in Today as Check this ad, so you decide on each one.'));
  return shellA('jobs', page('Jobs view', 'What the Jobs list leaves out. Nothing here changes a job\'s score or list.', body));
}

// ---------- Run defaults, the launcher at the cap ----------
function a_defaults(o = {}) {
  const hl = (t) => o.search ? `<span class="hit">${t}</span>` : t;
  const ov = [['/scrape', 'Haiku', '1.00'], ['/rank', 'Sonnet', '3.00'], ['/apply', 'Opus', '5.00']]
    .map(([c, m, b]) => `<tr><td class="path">${c}</td><td>${cmb(m, 170)}</td><td><span class="fd num" style="width: 110px"><span class="unit">$</span>${b}</span></td><td class="r">${B('Remove', 'sm')}</td></tr>`).join('');
  const body = sec('Every task', 'The launcher starts with these. You can still change them before you press Run.',
      sr('Model', 'Claude default leaves the choice to Claude Code.', cmb('Claude default', 200)) +
      sr(hl('Spend at most, USD'), 'Empty starts each command at its suggested budget, $1 to $5. An amount here starts every task there.', `<span class="fd" style="width: 120px"><span class="hint">Suggested</span></span>`)) +
    sec('Per command', 'A command listed here starts with its own model and budget.',
      `<table class="tb2 ov"><tr><th>Command</th><th>Model</th><th>${hl('Spend at most')}</th><th></th></tr>${ov}</table>
       <div style="padding-top: 8px">${B('Add a command', 'sm')}</div>`) +
    sec(hl('Monthly cap'), '',
      `<div class="sr chk">${cb(true)}<div><div class="lb">Stop at <span class="fd num" style="width: 96px; height: 28px; margin: 0 4px"><span class="unit">$</span>60.00</span> a month</div>
        <div class="hp">Once this month's tasks cost that much, Run in the launcher is disabled until the 1st and says why. A task that is running finishes.</div>
        <div class="row" style="gap: 10px; margin-top: 8px; max-width: 420px"><span class="share" style="width: 220px"><i style="width: 69%"></i></span><span class="muted num" style="font-size: 13px">$41.20 of $60.00 in October</span></div></div></div>`);
  const pg = page('Run defaults', 'The model and budget each task starts with.', body, { bar: true });
  return shellA('defaults', pg, { rail: o.search ? { query: 'spend', hits: 4, only: { usage: '1 match', defaults: '3 matches' } } : {} });
}
function a_cap() {
  const cmd = (n, s, w, on) => `<div class="crow2${on ? ' on' : ''}"><span class="path">${n}</span><span class="trunc">${s}</span><span class="fpath">${w}</span></div>`;
  const tabs = [['Today', '10'], ['Jobs', ''], ['Applications', ''], ['Insights', ''], ['Tasks', ''], ['Profile', '']]
    .map(([t, c]) => `<a class="${t === 'Tasks' ? 'on' : ''}" href="#"><span class="lbl">${t}</span>${c ? `<span class="chip num">${c}</span>` : ''}</a>`).join('');
  return `<div class="app st" data-theme="${THEME}">
    <header class="menu"><div class="brand">${MARK}Jobdesk</div><nav class="tabs" aria-label="Main">${tabs}</nav><span class="newtask">New task <span class="keys">Cmd K</span></span></header>
    <main class="main"><header class="bhead"><div><h1>New task</h1><div class="sub">Pick a command. Nothing runs until you press Run.</div></div></header>
      <div class="lbody"><section class="clist pg" style="padding: 4px 0 8px"><div style="padding: 0 0 0 0">
          <div class="gt">Find</div>${cmd('/scrape', 'Find new postings on installed portals', 'seen_jobs.json')}${cmd('/rank', 'Score new postings and build a shortlist', 'seen_jobs.json', true)}
          <div class="gt">Apply</div>${cmd('/apply', 'Evaluate a posting, then draft and review documents', 'cv, cover_letters, tracker')}${cmd('/interview', 'Build a prep pack for one application', 'interview_prep_&lt;stage&gt;.md')}${cmd('/outcome', 'Record progress, follow up, or sweep stale rows', 'tracker, outcome.md')}
          <div class="gt">Analyse</div>${cmd('/upskill', 'Find skill gaps and build a learning plan', 'upskill/report-*.md')}${cmd('/html-report', 'Rebuild the portable HTML dashboard', 'reports/*.html')}</div></section>
        <aside class="form"><div class="fh">/rank</div><div class="fb">
          <span class="muted">Score new postings and build a shortlist</span>
          <div><div class="lbl2">Focus area</div><span class="fd" style="width: 100%"></span></div>
          <div class="row" style="gap: 10px"><div style="flex: 1"><div class="lbl2">Model</div><span class="fd cmb" style="width: 100%">Sonnet</span></div><div style="flex: 1"><div class="lbl2">Spend at most, USD</div><span class="fd" style="width: 100%">3.00</span></div></div>
          <div><div class="lbl2" style="font-size: 12.5px">Claude will run</div><div class="code">/rank --limit 10</div></div>
          <span class="muted">Runs in your job search folder.</span>
          <span style="font-weight: 600">This month's tasks reached your $60.00 cap.</span>
          <div class="row" style="gap: 10px; position: relative">${B('Run', 'pri onpanel dis', 'Cmd Enter')}<span class="lk">Change the cap in Settings</span>
            <div class="tip" style="left: 26px; top: 44px; width: 270px">This month's tasks cost $60.40, over your $60.00 cap. Run opens again on 1 November.</div>${ARROW(50, 12)}</div>
        </div></aside></div></main>
    ${status(false)}</div>`;
}

// ---------- Permissions ----------
function a_perms() {
  const opt = (on, t, h) => `<div class="sr chk" style="grid-template-columns: auto minmax(0, 1fr)"><span class="rd${on ? ' on' : ''}"></span><div><div class="lb">${t}</div><div class="hp">${h}</div></div></div>`;
  const body = sec('Tool permissions', 'What happens when Claude wants to read, write or run something during a task.',
      opt(true, 'Allow and note in the activity', 'Tasks never stop for a permission. Each tool Claude used is listed in the task\'s activity, under its step.') +
      opt(false, 'Ask me before each tool', 'The task waits for you each time, with what Claude wants to do. Safer with postings you do not trust, and slower.')) +
    sec('Either way', '',
      sr('Questions from Claude', 'A question Claude asks you always reaches you, as Your turn on Today and Tasks.', TAG('Always on', 'plain')) +
      sr('Remembered rules', 'A tool you allow for the rest of a task stays allowed only until that task ends. It is never saved to your job search folder.', TAG('This task only', 'plain'))) +
    `<p class="muted" style="margin-top: 16px; font-size: 13px; max-width: 620px; line-height: 1.45">Allowing every tool means a posting written to trick Claude could get a command run before you see it. Jobdesk checks postings for hidden instructions before it scores them.</p>`;
  return shellA('perms', page('Permissions', 'Whether a task asks you before Claude uses a tool.', body));
}

// ---------- Runtime status: Setup's content ----------
function a_runtime() {
  const tool = (n, note, t, tone) => `<div class="sr" style="min-height: 44px; padding: 6px 0"><span class="path">${n}</span><span class="ct"><span class="muted">${note}</span>${TAG(t, tone)}</span></div>`;
  const marks = [1, 1, 1, 0, 1, 1, 1, 0, 0, 1, 1].map((f) => `<i style="display: block; width: 6px; height: 18px; background: var(--${f ? 'text' : 'interview'})"></i>`).join('');
  const body = `<p class="muted" style="margin-top: 14px">Jobdesk changes your folder only when you save an edit on the Profile screen. Everything else changes through a task you start.</p>` +
    sec('Claude Code', '',
      sr('On this computer', 'Jobdesk runs this program for every task.', '<span class="path">2.1.4</span>' + TAG('Installed', 'hired')) +
      sr('Signed in with', 'As the last task reported, 2 hours ago.', '<span class="val">Claude sign-in</span><span class="lk" style="margin-left: 8px">Providers</span>')) +
    sec('Profile', '', `<div class="sr"><div class="row" style="gap: 14px"><span style="display: flex; gap: 3px">${marks}</span><span><b class="num" style="font-weight: 600">8 of 11</b> topics filled</span></div><span class="ct">${B('Open Profile', 'sm')}</span></div>`) +
    sec('Environment', '4 of 5 ready. Optional tools never count against it.',
      tool('python3', 'State tools', 'Ready', 'hired') +
      `<div class="sr" style="min-height: 44px; padding: 6px 0"><span>Job site search: missing bun</span><span class="ct">${TAG('Missing', 'closed')}</span></div>` +
      tool('lualatex', 'CV', 'Ready', 'hired') + tool('xelatex', 'Cover letter', 'Ready', 'hired') + tool('pdftotext', 'Layout check', 'Optional', 'plain')) +
    sec('Portals', '', tool('linkedin-search', '412 jobs seen', 'Enabled', 'hired') + tool('jobnet-search', '96 jobs seen', 'Enabled', 'hired'));
  return shellA('runtime', page('Runtime status', 'Whether Claude Code, your profile, tools, portals, templates and sync are ready.', body, { acts: B('Check again', 'sm') + B('Look for more in your documents…', 'sm'), bar: true }));
}

// ---------- Data and privacy ----------
function a_data() {
  const body = sec('Data folder', 'Everything Jobdesk keeps apart from your job search folder.',
      sr('Folder', '<span class="path" style="color: var(--text)">~/Library/Application Support/Jobdesk</span>', B('Show in Finder', 'sm')) +
      sr('Size on disk', 'Run logs 211.8 MB, tray decisions 18 KB.', '<span class="val num">212 MB</span>')) +
    sec('Run logs', '',
      sr('Keep run logs for', 'Each log holds the whole text of a task, postings and your replies included. Forever keeps them all. A shorter time deletes older ones when Jobdesk starts. Usage statistics count only the logs kept.', togs(['30 days', '90 days', 'Forever'], 'Forever'))) +
    sec('Tray decisions', '',
      `<div class="sr" style="position: relative"><div><div class="lb">Clear tray decisions</div><div class="hp">Forgets every decision and skip reason on Today, so Today deals those cards again. Run logs stay.</div></div>
        <div class="ct">${B('Clear tray decisions', 'sm bad')}</div>
        <div class="popx" style="right: 0; top: 52px"><b style="font-weight: 600">Clear 214 tray decisions?</b>
          <span class="muted">Today deals every card again, the ones you skipped too. This cannot be undone.</span>
          <div class="row" style="gap: 6px; margin-top: 4px">${B('Keep them', 'pri foc')}${B('Clear decisions', 'bad')}</div>
          <span class="faint" style="font-size: 13px">Esc keeps them.</span></div></div>`) +
    `<p class="muted" style="margin-top: 14px; font-size: 13px">Run logs and decisions are readable only by your user account. Only tasks send anything out, through Claude Code.</p>`;
  return shellA('data', page('Data and privacy', 'What Jobdesk keeps on this computer, and for how long.', body));
}

// ---------- About ----------
function a_about() {
  const body = sec('This copy', '',
      sr('Jobdesk', 'Version and build, for a bug report.', '<span class="path">0.1.0</span>' + B('Copy details', 'sm')) +
      sr('Claude Code', 'The program each task runs, installed on its own.', '<span class="path">2.1.4</span>')) +
    sec('Read more', '',
      sr('How tasks sign in', 'Claude Code signs in on its own. Jobdesk keeps only an optional API key, in your keychain.', `<span class="lk">Open Providers</span>`) +
      sr('What changed', 'Every release, newest first.', `<span class="lk">Open the changelog</span>`) +
      sr('Licences', 'Jobdesk and the open-source parts it is built from.', `<span class="lk">Show licences</span>`)) +
    `<p class="muted" style="margin-top: 16px; font-size: 13px">Jobdesk runs Claude Code. It is not made by Anthropic.</p>`;
  return shellA('about', page('About Jobdesk', 'A desk for your ai-job-search folder.', body));
}

// ---------- The Setup tab in the menu ----------
function nav() {
  const tabs = (setup) => [['Today', setup ? '' : '10'], ['Jobs', ''], ['Applications', ''], ['Insights', ''], ['Tasks', ''], ['Profile', ''], ...(setup ? [['Setup', '']] : [])]
    .map(([t, c]) => `<a class="${t === (setup ? 'Setup' : 'Today') ? 'on' : ''}" href="#"><span class="lbl">${t}</span>${c ? `<span class="chip num">${c}</span>` : ''}</a>`).join('');
  const win = (cap, note, setup, ghost) => `<div class="win"><div class="cap"><b>${cap}</b><span class="muted">${note}</span></div>
    <header class="menu"><div class="brand">${MARK}Jobdesk</div><nav class="tabs">${tabs(setup)}</nav><span class="newtask">New task <span class="keys">Cmd K</span></span></header>
    <div class="ghost">${ghost}</div>${status(false)}</div>`;
  const sk = (w) => `<span class="sk" style="width: ${w}px"></span>`;
  return `<div class="app st" data-theme="${THEME}"><div class="nsheet">
    <header><h1>The Setup tab</h1><p>Setup shows in the menu whenever a required item is not ready, so during first onboarding too. Once all are ready it leaves the menu, and Settings, under System, shows the same content as Runtime status. It comes back if a required item goes missing later. Settings opens from the status bar, with Cmd , on a Mac and Ctrl , on Windows.</p></header>
    ${win('While a required item is not ready', 'Bun is missing, so Setup stays in the menu, as it does through first onboarding. Optional tools never keep it there.', true,
      `<div style="flex: 1 1 auto"><b style="font: 600 17px/1.3 var(--slab)">Setup</b><span class="muted">Profile 8 of 11, Environment 4 of 5 ready, Portals 2</span>${sk(420)}</div><div style="flex: 0 0 340px"><span class="muted">Job site search: missing bun</span>${sk(200)}${sk(160)}</div>`)}
    ${win('Once everything required is ready', 'No Setup tab. The same content is in Settings, Runtime status.', false,
      `<div style="flex: 1 1 auto"><b style="font: 600 17px/1.3 var(--slab)">10 things need you</b><span class="muted">Today, as built</span>${sk(380)}</div><div style="flex: 0 0 292px"><b style="font: 600 17px/1.3 var(--slab)">Done today</b>${sk(180)}</div>`)}
  </div></div>`;
}

const STATES = {
  usage: a_usage, 'usage-empty': a_usage_empty, loading: a_loading,
  providers: () => a_providers('login'), 'key-entry': () => a_providers('entry'), 'key-saved': () => a_providers('saved'), 'key-failed': () => a_providers('failed'),
  terms: () => a_terms(), 'terms-missing': () => a_terms({ missing: true }), 'terms-failed': a_terms_failed,
  general: a_general, appearance: a_appearance, queue: a_queue, jobs: a_jobs, defaults: () => a_defaults(), cap: a_cap, perms: a_perms,
  runtime: a_runtime, data: a_data, about: a_about, search: () => a_defaults({ search: true }),
  nav,
};
document.getElementById('root').innerHTML = (STATES[STATE] || a_usage)();
</script>
</body>
