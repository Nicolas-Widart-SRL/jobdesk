name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: app,dmg
            artifact: target/packages/*.dmg
          - os: windows-latest
            formats: nsis
            artifact: target/packages/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --test architecture
      # Screen snapshots depend on system fonts, so they run on one platform only.
      - run: cargo test --test screens
        if: runner.os == 'macOS'
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: jobdesk-${{ runner.os }}
          path: ${{ matrix.artifact }}
