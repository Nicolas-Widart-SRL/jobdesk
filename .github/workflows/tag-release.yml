# Releases when a release PR (opened by release.yml) merges into main: builds the installers on the merge commit,
# then tags it and creates the GitHub release from the CHANGELOG.md section.
#
# The trigger is a push to main, so the run belongs to refs/heads/main and the `release` environment, which allows
# only main, accepts it. A pull_request event runs on refs/pull/N/merge and would not pass that rule.
# A push runs the release jobs only for the merge of a release PR, and only after this check, which fails closed:
# the commit message must start like a release merge, then the pull requests GitHub lists for the commit must hold
# exactly one merged PR of this repository, from release/vX.Y.Z into main, whose merge commit is the pushed commit.
# GitHub can list no PR for a few seconds after a merge, so the check asks up to 5 times, 10 seconds apart. A commit
# that looks like a release merge and still has no PR fails the run with an error, and starts no release.
# Any other push to main starts nothing: its run shows as skipped.
# Squash and merge is the recommended way to merge a release PR, and a merge commit works too. A rebase merge is not
# supported: it can end on a commit that is not named chore(release): vX.Y.Z. Run this workflow by hand with the tag.
#
# The tag exists only once the installers built. A failed build leaves no tag.
# "Re-run failed jobs" rebuilds the same commit, so it only helps with flaky or infrastructure failures.
# A run that failed because the Apple secrets or the `release` environment were missing needs no new commit: add them,
# then "Re-run failed jobs", since a job reads its secrets when it starts.
# For a code failure, merge the fix into main through a normal PR, then run this workflow by hand with the tag.
# A merge whose squash subject was edited away from chore(release): vX.Y.Z is skipped without an error: run by hand too.
# The run by hand builds the current main commit, then tags and publishes the same way.
# The tag is pushed with GITHUB_TOKEN, which starts no other workflow, so this workflow calls installers.yml itself.
#
# macOS signing: the installers call asks for a signed release with `sign: true` and passes the six Apple secrets named
# below, and no other job gets them. They are environment secrets of the `release` environment, which only main can
# deploy to. The called workflow reads them in a job that sets `environment: release`. installers.yml signs the app
# with a Developer ID Application certificate and has Apple notarize it, so a release opens on macOS without the
# "cannot verify the developer" warning, though macOS may still ask once to confirm the download. A missing secret
# fails the build, and nothing is tagged. The macOS signing section of CONTRIBUTING.md says how to set the environment
# and the secrets up.
#
# Updates: installers.yml builds with no key. The sign job alone gets the update key, from the two secrets
# JOBDESK_UPDATE_KEY and JOBDESK_UPDATE_KEY_PASSWORD named in its signing step, and runs no build and only actions
# pinned to commits. It signs the two update files under their release names, so each signature names its version.
# Before it tags, publish checks both signatures against assets/update/jobdesk-update.pub and writes latest.json,
# the feed the app reads, with scripts/update-feed.sh.
name: Tag release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, vX.Y.Z. Cargo.toml and CHANGELOG.md on main must already hold this version.
        type: string
        required: true

permissions:
  contents: read

# A push gets a group of its own commit, so no other push can displace it while it waits: a group keeps one waiting
# run, and a decoy push that matches the message test would otherwise replace a real release. A run by hand gets the
# group of its tag, so two runs by hand for one tag queue instead of overlapping. A run by hand and a release push
# for the same tag are in different groups, because the tag of a push is known only after the version job reads it, so
# they can overlap. Two guards cover that: the version job refuses a tag already on origin, and the publish job
# refuses a tag on another commit and keeps a tag on the same commit.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('tag-release-{0}', inputs.tag) || format('tag-release-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  # Picks the tag and the commit to build, and says whether this run is a release at all. From here on, both events go
  # the same way. A push that is not a release merge ends here with release=false, and every later job skips.
  # Only this job reads pull requests, to tell a release merge from any other push to main.
  version:
    name: Read the release version
    # Cheap first test on the commit message, so most pushes to main start no runner. The check in the step is the real one.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' && (
          startsWith(github.event.head_commit.message, 'chore(release): v') ||
          (startsWith(github.event.head_commit.message, 'Merge pull request #') && contains(github.event.head_commit.message, '/release/v'))
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.read.outputs.release }}
      tag: ${{ steps.read.outputs.tag }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Read version
        id: read
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $REF != refs/heads/main ]]; then
            echo "::error::Run this workflow on main, not on '$REF'."
            exit 1
          fi
          if [[ $EVENT == workflow_dispatch ]]; then
            if ! [[ $INPUT_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$INPUT_TAG' is not vX.Y.Z."
              exit 1
            fi
            tag=$INPUT_TAG
          else
            # A release merge is the merge commit of exactly one merged PR of this repository, from release/vX.Y.Z into
            # main. GitHub lists the PR for a squash merge and for a merge commit alike, and can list none for a few
            # seconds after the merge, so an empty list is asked again. A failed API call fails the step.
            pulls='[]'
            for attempt in 1 2 3 4 5; do
              pulls=$(gh api "repos/$REPO/commits/$SHA/pulls")
              if [ "$(jq 'length' <<<"$pulls")" -gt 0 ]; then break; fi
              if [ "$attempt" -lt 5 ]; then sleep 10; fi
            done
            if [ "$(jq 'length' <<<"$pulls")" -eq 0 ]; then
              echo "::error::The commit message of $SHA looks like a release merge, but GitHub lists no pull request for it after 5 tries. No release starts. When the release PR did merge into main, run this workflow by hand with its tag."
              exit 1
            fi
            # shellcheck disable=SC2016  # $sha and $repo are jq's, not the shell's.
            branches=$(jq -r --arg sha "$SHA" --arg repo "$REPO" '[.[] | select(
                .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha and
                .head.repo.full_name == $repo and (.head.ref | test("^release/v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              ) | .head.ref] | unique | .[]' <<<"$pulls")
            if [ "$(printf '%s' "$branches" | grep -c .)" -ne 1 ]; then
              echo "::warning::$SHA is not the merge of a release/vX.Y.Z pull request, so no release starts."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag=${branches#release/}
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists on origin."
            exit 1
          fi
          # installers.yml checks that Cargo.toml holds the same version.
          if ! grep -qF "## [${tag#v}]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md section for ${tag#v} at $SHA"
            exit 1
          fi
          {
            echo "release=true"
            echo "tag=$tag"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  installers:
    name: Installers
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      tag: ${{ needs.version.outputs.tag }}
      sign: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

  # Signs the update files. The key reaches only the Sign step, in its environment, never a command line or a log.
  # No checkout and no build, so no code from the repository or its dependencies runs beside it.
  sign:
    name: Sign the updates
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dmg
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: setup
          path: dist

      # Ubuntu's own package, which apt checks against the archive's signing key.
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # The key file is written to a folder only this user can read, and deleted when the step ends.
      # minisign reads the password from stdin. The trusted comment names the file, which the app checks.
      - name: Sign
        env:
          UPDATE_KEY: ${{ secrets.JOBDESK_UPDATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.JOBDESK_UPDATE_KEY_PASSWORD }}
        run: |
          if [ -z "$UPDATE_KEY" ] || [ -z "$UPDATE_KEY_PASSWORD" ]; then
            echo "::error::A release needs the update key. Set the JOBDESK_UPDATE_KEY and JOBDESK_UPDATE_KEY_PASSWORD secrets, as the Release section of CONTRIBUTING.md says."
            exit 1
          fi
          umask 077
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          printf '%s' "$UPDATE_KEY" | base64 -d > "$keys/update.key"
          mkdir signatures
          for name in "Jobdesk-$TAG-macos-arm64.app.tar.gz" "Jobdesk-$TAG-windows-x64-setup.exe"; do
            if [ ! -s "dist/$name" ]; then
              echo "::error::dist/$name is missing."
              exit 1
            fi
            printf '%s\n' "$UPDATE_KEY_PASSWORD" | minisign -S -s "$keys/update.key" -m "dist/$name" -x "$keys/$name.minisig" \
              -c "signature from the Jobdesk update key" -t "timestamp:$(date +%s)"$'\t'"file:$name"
            base64 -w0 < "$keys/$name.minisig" > "signatures/$name.sig"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signatures
          path: signatures/*.sig
          if-no-files-found: error

  publish:
    name: Tag and publish release
    needs: [version, installers, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    # Its actions are pinned to commits, because the job holds a token that can write the repository.
    steps:
      # Every tag, so the check below finds the key of the release before this one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      # Edits made on the release branch count: the notes come from CHANGELOG.md at the built commit.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No CHANGELOG.md section for $version at $SHA"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      # Only the installers: a failed earlier attempt may have left snapshot artifacts in the run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dmg
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: setup
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signatures
          path: dist

      # A build the installed copies cannot check must never be published. They trust the key of the release they run,
      # so both updates must pass the key of the latest release before this one, under their own names, before anything
      # is tagged. A release that carries a new key is still signed with the old one. Only when no earlier release
      # carries a real key, at the first release with updates, is the key of this commit the one to pass.
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Check the update signatures and write latest.json
        run: |
          file=assets/update/jobdesk-update.pub
          if grep -q PLACEHOLDER "$file"; then
            echo "::error::$file still holds the placeholder. Add the public update key, as the Release section of CONTRIBUTING.md says."
            exit 1
          fi
          previous=$(git tag --merged "$SHA" --list 'v*' --sort=-v:refname | grep -vxF "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          key="$file at $SHA"
          cp "$file" "$RUNNER_TEMP/jobdesk-update.pub.b64"
          if [ -n "$previous" ] && git show "$previous:$file" > "$RUNNER_TEMP/previous.pub.b64" 2>/dev/null \
            && ! grep -q PLACEHOLDER "$RUNNER_TEMP/previous.pub.b64"; then
            key="$file at $previous"
            cp "$RUNNER_TEMP/previous.pub.b64" "$RUNNER_TEMP/jobdesk-update.pub.b64"
          fi
          echo "Checking the signatures against $key."
          base64 -d "$RUNNER_TEMP/jobdesk-update.pub.b64" > "$RUNNER_TEMP/jobdesk-update.pub"
          for update in "dist/Jobdesk-$TAG-macos-arm64.app.tar.gz" "dist/Jobdesk-$TAG-windows-x64-setup.exe"; do
            if [ ! -s "$update" ] || [ ! -s "$update.sig" ]; then
              echo "::error::$update or its .sig is missing."
              exit 1
            fi
            minisig="$RUNNER_TEMP/$(basename "$update").minisig"
            base64 -d "$update.sig" > "$minisig"
            if ! minisign -V -q -p "$RUNNER_TEMP/jobdesk-update.pub" -m "$update" -x "$minisig"; then
              echo "::error::$update does not match $key."
              exit 1
            fi
            # Exactly one file field, and it names this file, as the app requires.
            files=$(sed -n 's/^trusted comment: //p' "$minisig" | tr '\t' '\n' | grep '^file:' || true)
            if [ "$files" != "file:$(basename "$update")" ]; then
              echo "::error::The signature of $update does not name it, and it alone."
              exit 1
            fi
          done
          scripts/update-feed.sh "$TAG" "$RUNNER_TEMP/release-notes.md" dist > "$RUNNER_TEMP/latest.json"
          rm dist/*.sig
          mv "$RUNNER_TEMP/latest.json" dist/latest.json
          cat dist/latest.json

      # A re-run after a later step failed finds the tag it pushed, and keeps it.
      - name: Tag the commit
        run: |
          tagged=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          if [ "$tagged" = "$SHA" ]; then
            echo "$TAG already tags $SHA."
            exit 0
          elif [ -n "$tagged" ]; then
            echo "::error::Tag $TAG already exists on origin, on $tagged."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      # A re-run after this step failed finds the release, and uploads the installers and latest.json again.
      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" dist/*
          fi

      # A run by hand usually finds the branch gone already.
      - name: Delete the release branch
        run: |
          branch="release/$TAG"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            git push origin --delete "$branch"
          else
            echo "$branch is already deleted."
          fi
