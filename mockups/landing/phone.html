<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone frame</title>
<style>
  /* Headless Chrome will not make a window narrower than 500px, so a 390px render shows the page in a 390px frame.
     Headless Chrome also leaves the bottom of the window unpainted, so render a taller window with the frame centred:
     --size 500,H+160 with h=H and top=80, then crop the PNG to its middle H x 390 (sips -c H 390 crops around the centre).
     Pass theme, motion and measure=1 through to the page. Not part of the site. */
  html, body { margin: 0; background: #ffffff; }
  iframe { display: block; border: 0; width: 390px; margin: 0 auto; }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var h = Math.max(200, Math.min(20000, parseInt(q.get("h") || "844", 10) || 844));
  var pass = new URLSearchParams();
  ["theme", "motion", "measure"].forEach(function (k) { if (q.get(k)) pass.set(k, q.get(k)); });
  var frame = document.createElement("iframe");
  frame.title = "The landing page at 390 wide";
  frame.style.height = h + "px";
  frame.style.marginTop = Math.max(0, Math.min(400, parseInt(q.get("top") || "0", 10) || 0)) + "px";
  frame.src = "./Landing.html?" + pass.toString();
  document.body.appendChild(frame);
</script>
</body>
</html>
